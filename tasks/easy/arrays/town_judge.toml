base_score        = 100
level             = "easy"
name              = "town_judge"
tags              = ["arrays", "graphs"]
time_to_solve_sec = 250

description_en = """
In a town, there are $n$ people labeled from $1$ to $n$. There is a rumor that one of these people is secretly the town judge.

The town judge satisfies two properties:
1. The town judge trusts nobody.
2. Everybody (except for the town judge) trusts the town judge.

You are given an array `trust` where `trust[i] = [a, b]` representing that the person labeled `a` trusts the person labeled `b`.

Return the label of the town judge if they exist and can be identified, or return `-1` otherwise.

Every trust pair is distinct, with both labels between $1$ and $n$ and different from each other.
"""

description_ru = """
В городе живут $n$ людей, пронумерованных от $1$ до $n$. Ходят слухи, что один из них — городской судья.

Судья должен соответствовать двум условиям:
1. Судья никому не доверяет.
2. Все остальные жители города (кроме самого судьи) доверяют судье.

Вам дан массив пар `trust`, где `trust[i] = [a, b]` означает, что человек `a` доверяет человеку `b`.

Верните номер городского судьи, если он существует, иначе верните `-1`.

Все пары доверия различны; обе метки находятся от $1$ до $n$ и отличаются друг от друга.
"""

description_es = """
En un pueblo, hay personas $n$ etiquetadas desde $1$ hasta $n$. Corre el rumor de que una de estas personas es en secreto el juez del pueblo.

El juez del pueblo satisface dos propiedades:
1. El juez municipal no se fía de nadie.
2. Todo el mundo (excepto el juez municipal) confía en el juez municipal.

Se le proporciona una matriz `trust` donde `trust[i] = [a, b]` representa que la persona etiquetada `a` confía en la persona etiquetada `b`.

Devolver la etiqueta del juez del pueblo si existen y se pueden identificar, o devolver `-1` en caso contrario.

Cada par de confianza es distinto, con ambas etiquetas entre $1$ y $n$ y diferentes entre sí.
"""

description_zh = """
在一个城镇中，有 $n$ 人，标签为 $1$ 到 $n$。有传言说，其中一个人秘密是镇法官。

城镇法官满足两个属性：
1. 镇法官不相信任何人。
2. 每个人（镇法官除外）都信任镇法官。

给您一个数组 `trust`，其中 `trust[i] = [a, b]` 表示标记为 `a` 的人信任标记为 `b` 的人。

如果存在且可识别则返回镇法官的标签，否则返回`-1`。

每个信任对都是不同的，两个标签都在 $1$ 和 $n$ 之间，并且彼此不同。
"""

limits = """
- $1 \\leq n \\leq 1000$
- $0 \\leq \\text{len}(\\text{trust}) \\leq 10^4$
- $\\text{trust}[i][0] \\neq \\text{trust}[i][1]$

- $1 \\leq \\text{trust}[i][0], \\text{trust}[i][1] \\leq n$
"""

solution = """
def solution(n: int, trust: list) -> int:
    d = [0] * (n + 1)
    for a, b in trust:
        d[a] -= 1
        d[b] += 1
    for i in range(1, n + 1):
        if d[i] == n - 1:
            return i
    return -1
"""

examples = """
solution(2, [[1, 2]]) == 2
solution(3, [[1, 3], [2, 3]]) == 3
solution(3, [[1, 2], [2, 3]]) == -1
solution(3, [[1, 3], [2, 3], [3, 1]]) == -1
"""

