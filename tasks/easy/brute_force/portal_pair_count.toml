base_score        = 95
level             = "easy"
name              = "portal_pair_count"
tags              = ["brute_force", "strings", "spider_man"]
time_to_solve_sec = 280

description_en = """
Every portal has a circular code in `codes`; all codes have the same positive length. Portals at distinct indices $i < j$ link if `codes[j]` can be obtained from `codes[i]` by a **non-zero** cyclic left rotation.

Count linked index pairs. For a periodic code, a non-zero rotation may reproduce the same string, so equal codes can sometimes link. A one-character code has no non-zero rotation.
"""

description_ru = """
У каждого портала есть циклический код из массива `codes`; все коды имеют одинаковую положительную длину. Порталы с разными индексами $i < j$ соединяются, если `codes[j]` можно получить из `codes[i]` **ненулевым** циклическим сдвигом влево.

Посчитайте соединенные пары индексов. Для периодического кода ненулевой сдвиг может дать ту же строку, поэтому одинаковые коды иногда соединяются. У кода из одного символа нет ненулевого сдвига.
"""

description_es = """
Todo portal tiene un código circular en `codes`; Todos los códigos tienen la misma longitud positiva. Los portales en índices distintos $i < j$ se vinculan si `codes[j]` se pueden obtener de `codes[i]` mediante una rotación cíclica hacia la izquierda **distinta de cero**.

Cuente los pares de índices vinculados. Para un código periódico, una rotación distinta de cero puede reproducir la misma cadena, por lo que a veces se pueden vincular códigos iguales. Un código de un carácter no tiene rotación distinta de cero.
"""

description_zh = """
每个门户都有一个循环代码`codes`；所有代码都具有相同的正长度。如果可以通过**非零**循环左旋转从 `codes[i]` 获得 `codes[j]`，则不同索引 $i < j$ 处的门户链接。

计算链接索引对。对于周期码，非零旋转可能会再现相同的字符串，因此相等的码有时可以链接。单字符代码没有非零旋转。
"""

limits = """
- $0 \\leq \\text{len}(\\text{codes}) \\leq 100$
- $1 \\leq \\text{len}(\\text{codes}[i]) \\leq 8$
- $\\text{len}(\\text{codes}[i]) = \\text{len}(\\text{codes}[j])$
"""

solution = """
def solution(codes: list[str]) -> int:
    linked = lambda first, second: any(first[shift:] + first[:shift] == second for shift in range(1, len(first)))
    return sum(linked(first, second) for i, first in enumerate(codes) for second in codes[i + 1:])
"""

examples = """
solution([]) == 0
solution(["AB", "BA"]) == 1
solution(["ABC", "BCA", "CAB"]) == 3
"""

