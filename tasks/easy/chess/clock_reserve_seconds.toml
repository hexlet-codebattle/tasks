base_score        = 65
level             = "easy"
name              = "clock_reserve_seconds"
tags              = ["chess", "prefix_sums"]
time_to_solve_sec = 240

description_en = """
Your clock starts with an unknown nonnegative integer number of seconds. The list `times` gives the duration of each of your moves, in seconds and chronological order.

For each move, first subtract its duration. The remaining time must be **strictly positive**; zero already means you ran out of time. Only after a successful move, add `increment` seconds. Your clock does not run during the opponent's moves.

Return the smallest integer starting time that lets you complete every listed move. Return $0$ if there are no moves.
"""

description_ru = """
На ваших часах изначально неизвестное неотрицательное целое число секунд. Список `times` задаёт длительность каждого вашего хода в секундах, в хронологическом порядке.

При каждом ходе сначала вычитается его длительность. Остаток должен быть **строго положительным**: ноль уже означает просрочку. Только после успешного хода добавляется `increment` секунд. Во время ходов соперника ваши часы не идут.

Верните минимальное целое начальное время, позволяющее завершить все указанные ходы. Если ходов нет, верните $0$.
"""

description_es = """
Tu reloj comienza con un número entero no negativo de segundos desconocido. `times` contiene la duración de cada uno de tus movimientos, en segundos y en orden cronológico.

En cada movimiento, primero se resta su duración. El tiempo restante debe ser **estrictamente positivo**: cero ya significa que se agotó. Solo después de un movimiento válido se añaden `increment` segundos. Tu reloj no avanza durante los movimientos del rival.

Devuelve el mínimo tiempo inicial entero que permite completar todos los movimientos indicados. Si no hay movimientos, devuelve $0$.
"""

description_zh = """
你的时钟初始有一个未知的非负整数秒数。`times` 按时间顺序给出你每一步耗费的秒数。

每步先扣除耗时。剩余时间必须**严格大于零**；等于零也算超时。只有成功完成这步后，才增加 `increment` 秒。对手行动时，你的时钟不计时。

返回能够完成所有给定步骤的最小整数初始时间。如果没有步骤，返回 $0$。
"""

limits = """
- $0 \\leq |times| \\leq 12$
- $0 \\leq times_i \\leq 120$
- $0 \\leq increment \\leq 30$
"""

solution = """
def solution(times, increment):
    from itertools import accumulate
    deficits = [spent - i * increment for i, spent in enumerate(accumulate(times))]
    return max(deficits, default=-1) + 1
"""

examples = """
```python
solution([], 0) == 0
solution([5, 5], 0) == 11
solution([5, 10], 5) == 11
```
"""

