base_score        = 50
level             = "easy"
name              = "knight_fork_check"
tags              = ["chess", "geometry"]
time_to_solve_sec = 180

description_en = """
A board has columns `a` through `h` and rows `1` through `8`; for example, `c5` is column `c`, row `5`. Your knight is on `knight`. Opposing pieces occupy the distinct squares in `pieces`, none equal to `knight`.

A knight attacks a square when the absolute column and row differences are $1$ and $2$, in either order. Squares between them do not matter. The pieces do not move; no other chess rules apply.

Return `True` if the knight attacks at least two opposing pieces, otherwise `False`. For example, a knight on `d4` attacks both `b3` and `f5`. An empty list returns `False`.
"""

description_ru = """
На доске столбцы обозначены буквами от `a` до `h`, строки — числами от `1` до `8`; например, `c5` — столбец `c`, строка `5`. Ваш конь стоит на `knight`. Фигуры противника занимают различные клетки из `pieces`, ни одна не совпадает с `knight`.

Конь атакует клетку, если абсолютные разности номеров столбцов и строк равны $1$ и $2$ в любом порядке. Клетки между ними не имеют значения. Фигуры не двигаются; другие шахматные правила не применяются.

Верните `True`, если конь атакует хотя бы две фигуры противника, иначе `False`. Например, конь на `d4` атакует и `b3`, и `f5`. Для пустого списка ответ — `False`.
"""

description_es = """
El tablero tiene columnas de `a` a `h` y filas de `1` a `8`; por ejemplo, `c5` es la columna `c`, fila `5`. Tu caballo está en `knight`. Las piezas rivales ocupan las casillas distintas de `pieces`, ninguna igual a `knight`.

Un caballo ataca una casilla si las diferencias absolutas de columna y fila son $1$ y $2$, en cualquier orden. Las casillas intermedias no importan. Las piezas no se mueven; no se aplican otras reglas de ajedrez.

Devuelve `True` si el caballo ataca al menos dos piezas rivales; en caso contrario, `False`. Por ejemplo, desde `d4` ataca `b3` y `f5`. Una lista vacía devuelve `False`.
"""

description_zh = """
棋盘的列为 `a` 到 `h`，行为 `1` 到 `8`；例如，`c5` 表示第 `c` 列、第 `5` 行。你的马位于 `knight`。对方棋子位于 `pieces` 中互不相同的格子，且都不在 `knight` 上。

当列与行编号的绝对差分别为 $1$ 和 $2$（顺序不限）时，马攻击该格子。中间格子不影响攻击。棋子不移动，也不使用其他国际象棋规则。

如果马攻击至少两枚对方棋子，返回 `True`，否则返回 `False`。例如，位于 `d4` 的马会攻击 `b3` 和 `f5`。空列表返回 `False`。
"""

limits = """
- $knight, pieces_i \\in \\{a,b,c,d,e,f,g,h\\}\\times\\{1,2,3,4,5,6,7,8\\}$
- $0 \\leq |pieces| \\leq 8$
- $|\\{pieces_i\\}|=|pieces|$
- $knight \\notin pieces$
"""

solution = """
def solution(knight, pieces):
    x, y = ord(knight[0]), int(knight[1])
    attacked = sum(sorted((abs(ord(p[0]) - x), abs(int(p[1]) - y))) == [1, 2] for p in pieces)
    return attacked >= 2
"""

examples = """
```python
solution('d4', []) == False
solution('d4', ['b3']) == False
solution('d4', ['b3', 'f5']) == True
```
"""

