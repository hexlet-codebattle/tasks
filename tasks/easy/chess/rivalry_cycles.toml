base_score        = 75
level             = "easy"
name              = "rivalry_cycles"
tags              = ["chess", "combinatorics"]
time_to_solve_sec = 240

description_en = """
There are `n` players numbered from $0$ to $n-1$. Each pair played exactly once, with one winner and no draw.

The string `results` records pairs in this order: $(0,1),(0,2),\\ldots,(0,n-1),(1,2),\\ldots,(n-2,n-1)$. For each pair $(a,b)$ with $a<b$, `1` means player $a$ won and `0` means player $b$ won. For fewer than two players the string is empty.

Return the number of unordered groups of three players in which everyone beat one of the other two and lost to the other: $A$ beat $B$, $B$ beat $C$, and $C$ beat $A$. Count each group once.
"""

description_ru = """
Есть `n` игроков с номерами от $0$ до $n-1$. Каждая пара сыграла ровно одну партию, в которой был победитель; ничьих нет.

Строка `results` содержит результаты пар в порядке $(0,1),(0,2),\\ldots,(0,n-1),(1,2),\\ldots,(n-2,n-1)$. Для пары $(a,b)$, где $a<b$, символ `1` означает победу игрока $a$, а `0` — игрока $b$. При числе игроков меньше двух строка пустая.

Верните число неупорядоченных троек, внутри которых каждый победил одного соперника и проиграл другому: $A$ победил $B$, $B$ победил $C$, $C$ победил $A$. Каждую тройку считайте один раз.
"""

description_es = """
Hay `n` jugadores numerados de $0$ a $n-1$. Cada pareja jugó exactamente una vez, con un ganador y sin empate.

`results` registra las parejas en este orden: $(0,1),(0,2),\\ldots,(0,n-1),(1,2),\\ldots,(n-2,n-1)$. Para cada pareja $(a,b)$ con $a<b$, `1` indica que ganó $a$ y `0` que ganó $b$. Con menos de dos jugadores, la cadena está vacía.

Devuelve el número de grupos no ordenados de tres jugadores en los que cada uno venció a uno de los otros dos y perdió contra el otro: $A$ venció a $B$, $B$ a $C$ y $C$ a $A$. Cuenta cada grupo una sola vez.
"""

description_zh = """
有 `n` 名选手，编号从 $0$ 到 $n-1$。每两人恰好交手一次，每局都有胜者，没有平局。

字符串 `results` 按以下顺序记录对局：$(0,1),(0,2),\\ldots,(0,n-1),(1,2),\\ldots,(n-2,n-1)$。对于 $a<b$ 的一对 $(a,b)$，`1` 表示 $a$ 获胜，`0` 表示 $b$ 获胜。少于两名选手时字符串为空。

返回满足以下条件的无序三人组数量：每人都战胜其中一人，并输给另一人，即 $A$ 胜 $B$、$B$ 胜 $C$、$C$ 胜 $A$。每组三人只计算一次。
"""

limits = """
- $0 \\leq n \\leq 12$
- $|results|=n(n-1)/2$
- $results \\in \\{0,1\\}^*$
"""

solution = """
def solution(n, results):
    from itertools import combinations
    wins = dict(zip(combinations(range(n), 2), results))
    return sum(wins[a, b] == wins[b, c] != wins[a, c] for a, b, c in combinations(range(n), 3))
"""

examples = """
```python
solution(2, '0') == 0
solution(3, '000') == 0
solution(3, '010') == 1
```
"""

