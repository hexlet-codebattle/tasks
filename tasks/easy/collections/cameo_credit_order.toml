base_score        = 90
level             = "easy"
name              = "cameo_credit_order"
tags              = ["collections", "spider_man"]
time_to_solve_sec = 260

description_en = """
`appearances` lists character names in the order in which they appear in the new Spider-Man movie. The credits contain every distinct name once.

Return the credits ordered by decreasing number of appearances. If two names have the same count, the one whose first appearance is earlier comes first. Return an empty array for no appearances.
"""

description_ru = """
Массив `appearances` содержит имена персонажей в порядке их появления в новом фильме о Человеке-пауке. В титрах каждое уникальное имя встречается один раз.

Верните титры, упорядоченные по убыванию числа появлений. При равенстве раньше идет имя, которое впервые появилось раньше. Для пустого списка появлений верните пустой массив.
"""

description_es = """
`appearances` enumera los nombres de los personajes en el orden en que aparecen en la nueva película de Spider-Man. Los créditos contienen cada nombre distinto una vez.

Devuelve los créditos ordenados por número decreciente de apariciones. Si dos nombres tienen el mismo número, el que aparece por primera vez es el primero. Devuelve una matriz vacía sin apariciones.
"""

description_zh = """
`appearances` 按顺序记录新蜘蛛侠电影中出现的角色名称。演职员表中每个不同的名称只列出一次。

返回按出现次数降序排列的名称。如果两个名称的出现次数相同，则首次出现较早的排在前面。若没有角色出现，则返回空数组。
"""

limits = """
- $0 \\leq \\text{len}(\\text{appearances}) \\leq 10^3$
- $1 \\leq \\text{len}(\\text{appearances}[i]) \\leq 30$
"""

solution = """
def solution(appearances: list[str]) -> list[str]:
    names = list(dict.fromkeys(appearances))
    return sorted(names, key=lambda name: (-appearances.count(name), names.index(name)))
"""

examples = """
solution([]) == []
solution(["Peter"]) == ["Peter"]
solution(["A", "B", "C", "B", "C", "C"]) == ["C", "B", "A"]
"""

