base_score        = 75
level             = "easy"
name              = "danger_sense_ring"
tags              = ["collections", "spider_man"]
time_to_solve_sec = 220

description_en = """
The mask's danger sensors form a ring. `readings[i]` is the signal at sensor $i$; sensor $0$ is adjacent to both sensor $1$ and the last sensor.

Return, in increasing order, the indices whose reading is **strictly greater** than both cyclic neighbors. Equal readings never form a peak.
"""

description_ru = """
Датчики опасности в маске образуют кольцо. `readings[i]` — сигнал датчика $i$; датчик $0$ соседствует и с датчиком $1$, и с последним датчиком.

Верните по возрастанию индексы, значения которых **строго больше** значений обоих соседей по кольцу. Равные значения не образуют пик.
"""

limits = """
- $3 \\leq \\text{len}(\\text{readings}) \\leq 10^4$
- $0 \\leq \\text{readings}[i] \\leq 10^9$
"""

solution = """
def solution(readings: list[int]) -> list[int]:
    size = len(readings)
    return [i for i, value in enumerate(readings) if value > readings[i - 1] and value > readings[(i + 1) % size]]
"""

examples = """
solution([1, 1, 1]) == []
solution([1, 2, 3]) == [2]
solution([5, 1, 4, 2]) == [0, 2]
"""

