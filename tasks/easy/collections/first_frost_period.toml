base_score        = 55
level             = "easy"
name              = "first_frost_period"
tags              = ["collections", "linear_scan"]
time_to_solve_sec = 180

description_en = """
A single cold morning and a lasting cold spell affect organisms differently, so a phenological model looks for a run of cold days. A day is cold when its temperature is at most `threshold`.

Return the index of the first day that starts a block of `days` consecutive cold days, or $-1$ if there is no such block.
"""

description_ru = """
Одно холодное утро и устойчивое похолодание действуют на организмы по-разному, поэтому фенологическая модель ищет серию холодных дней. День считается холодным, если его температура не превышает `threshold`.

Верните индекс первого дня, с которого начинается блок из `days` подряд идущих холодных дней, или $-1$, если такого блока нет.
"""

description_es = """
Una sola mañana fría y una ola de frío duradera afectan a los organismos de manera diferente, por lo que un modelo fenológico busca una serie de días fríos. Un día es frío cuando su temperatura es como máximo `threshold`.

Devuelve el índice del primer día que inicia un bloque de días fríos consecutivos `days`, o $-1$ si no existe dicho bloque.
"""

description_zh = """
一个寒冷的早晨和持续的寒潮对生物体的影响不同，因此物候模型会寻找一系列寒冷的日子。当温度最高为 `threshold` 时，一天是寒冷的。

返回`days`连续冷天区块的第一天的索引，如果没有这样的区块则返回$-1$。
"""

limits = """
- $1 \\leq \\text{len}(\\text{temperatures}) \\leq 10^4$
- $-60 \\leq \\text{temperatures}[i] \\leq 40$
- $-60 \\leq \\text{threshold} \\leq 40$
- $1 \\leq \\text{days} \\leq 10^4$
"""

solution = """
def solution(temperatures: list[int], threshold: int, days: int) -> int:
    run = 0
    for i, temperature in enumerate(temperatures):
        run = run + 1 if temperature <= threshold else 0
        if run == days:
            return i - days + 1
    return -1
"""

examples = """
solution([1], 0, 1) == -1
solution([5, 8, 5], 6, 2) == -1
solution([9, 3, 2, 4], 4, 3) == 1
"""

