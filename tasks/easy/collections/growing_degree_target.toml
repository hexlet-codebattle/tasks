base_score        = 45
level             = "easy"
name              = "growing_degree_target"
tags              = ["collections", "linear_scan"]
time_to_solve_sec = 150

description_en = """
Phenologists track plant development with accumulated heat: a day with temperature `t` adds $\\max(0, t - \\text{base})$ heat units. Days are processed in the order given by `temperatures`, and the heat of all processed days is summed.

Return the smallest index at which the accumulated heat is at least `target`, or $-1$ if it never reaches `target`.
"""

description_ru = """
Фенологи оценивают развитие растений по сумме тепла: день с температурой `t` добавляет $\\max(0, t - \\text{base})$ единиц тепла. Дни обрабатываются в порядке массива `temperatures`, тепло всех обработанных дней суммируется.

Верните наименьший индекс, на котором накопленное тепло не меньше `target`, или $-1$, если оно никогда не достигнет `target`.
"""

limits = """
- $1 \\leq \\text{len}(\\text{temperatures}) \\leq 10^4$
- $-50 \\leq \\text{temperatures}[i] \\leq 50$
- $-50 \\leq \\text{base} \\leq 50$
- $1 \\leq \\text{target} \\leq 10^5$
"""

solution = """
def solution(temperatures: list[int], base: int, target: int) -> int:
    total = 0
    for i, temperature in enumerate(temperatures):
        total += max(0, temperature - base)
        if total >= target:
            return i
    return -1
"""

examples = """
solution([10], 10, 1) == -1
solution([5, 6, 7], 10, 1) == -1
solution([8, 12, 15, 9], 10, 7) == 2
"""

