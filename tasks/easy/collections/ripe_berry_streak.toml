base_score        = 40
level             = "easy"
name              = "ripe_berry_streak"
tags              = ["collections", "linear_scan"]
time_to_solve_sec = 120

description_en = """
Soluble sugar content rises as fruit ripens, so it serves as one measure of ripeness. A berry is ripe when its value in `sugar` is at least `min_sugar`.

Return the length of the longest block of consecutive ripe berries on the branch, or $0$ when no berry is ripe.
"""

description_ru = """
При созревании плодов растёт содержание растворимых сахаров, поэтому его используют как показатель зрелости. Ягода считается зрелой, если её значение в `sugar` не меньше `min_sugar`.

Верните длину самого длинного непрерывного участка зрелых ягод на ветке или $0$, если зрелых ягод нет.
"""

description_es = """
El contenido de azúcar soluble aumenta a medida que la fruta madura, por lo que sirve como medida de madurez. Una baya está madura cuando su valor en `sugar` es al menos `min_sugar`.

Devuelve la longitud del bloque más largo de bayas maduras consecutivas en la rama, o $0$ cuando ninguna baya esté madura.
"""

description_zh = """
随着果实成熟，可溶性糖含量上升，因此它可以作为成熟度的衡量标准之一。当浆果在 `sugar` 中的值至少为 `min_sugar` 时，浆果就成熟了。

返回树枝上最长的连续成熟浆果块的长度，如果没有浆果成熟，则返回 $0$。
"""

limits = """
- $0 \\leq \\text{len}(\\text{sugar}) \\leq 10^4$
- $0 \\leq \\text{sugar}[i] \\leq 100$
- $0 \\leq \\text{min\\_sugar} \\leq 100$
"""

solution = """
def solution(sugar: list[int], min_sugar: int) -> int:
    best = run = 0
    for value in sugar:
        run = run + 1 if value >= min_sugar else 0
        best = max(best, run)
    return best
"""

examples = """
solution([], 5) == 0
solution([4, 5, 6], 7) == 0
solution([8, 12, 11, 5, 10], 10) == 2
"""

