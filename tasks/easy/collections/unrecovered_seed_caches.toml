base_score        = 50
level             = "easy"
name              = "unrecovered_seed_caches"
tags              = ["collections", "hash_maps", "sorting"]
time_to_solve_sec = 160

description_en = """
Squirrels spread food over many caches, and the seeds they never recover sometimes sprout and help trees to spread. A cache label is written down once when a seed is buried there and once more when a seed is taken back.

Return the labels recorded an odd number of times, sorted in ascending alphabetical order. Return an empty array when there is no such label.
"""

description_ru = """
Белки распределяют запасы по множеству тайников, а забытые семена иногда прорастают и помогают расселению деревьев. Метка тайника записывается один раз при захоронении семени и ещё раз при его извлечении.

Верните метки, встречающиеся нечётное число раз, отсортированные по алфавиту по возрастанию. Если таких меток нет, верните пустой массив.
"""

description_es = """
Las ardillas esparcen comida en muchos escondites y las semillas que nunca recuperan a veces brotan y ayudan a los árboles a propagarse. Una etiqueta de caché se escribe una vez cuando se entierra una semilla allí y una vez más cuando se retira la semilla.

Devuelve las etiquetas grabadas un número impar de veces, ordenadas en orden alfabético ascendente. Devuelve una matriz vacía cuando no existe dicha etiqueta.
"""

description_zh = """
松鼠将食物散播到许多储藏室，而它们从未回收的种子有时会发芽，帮助树木蔓延。当种子被埋在那里时，缓存标签被记录一次，当种子被取回时，缓存标签被记录一次。

返回记录奇数次的标签，按字母升序排序。当没有这样的标签时返回一个空数组。
"""

limits = """
- $0 \\leq \\text{len}(\\text{tags}) \\leq 10^4$
- $1 \\leq \\text{len}(\\text{tags}[i]) \\leq 20$
- $\\text{tags}[i] \\in \\{a{-}z\\}^*$
"""

solution = """
def solution(tags: list[str]) -> list[str]:
    from collections import Counter
    return sorted(tag for tag, count in Counter(tags).items() if count % 2)
"""

examples = """
solution([]) == []
solution(["oak", "oak"]) == []
solution(["pine", "oak", "pine", "birch"]) == ["birch", "oak"]
"""

[[input_signature]]
argument_name = "tags"
[input_signature.type]
name = "array"
[input_signature.type.nested]
name = "string"

[output_signature.type]
name = "array"
[output_signature.type.nested]
name = "string"

[[asserts]]
arguments = [["oak", "oak"]]
comment   = "One cache buried and recovered"
expected  = []

[[asserts]]
arguments = [["pine", "oak", "pine", "birch"]]
comment   = "Two labels stay unrecovered"
expected  = ["birch", "oak"]

[[asserts]]
arguments = [[]]
comment   = "No records at all"
expected  = []

[[asserts]]
arguments = [["oak"]]
comment   = "Single buried cache"
expected  = ["oak"]

[[asserts]]
arguments = [["oak", "oak", "oak"]]
comment   = "Three records of one label"
expected  = ["oak"]

[[asserts]]
arguments = [["oak", "oak", "oak", "oak"]]
comment   = "Four records of one label"
expected  = []

[[asserts]]
arguments = [["birch", "oak", "pine"]]
comment   = "Every label recorded once"
expected  = ["birch", "oak", "pine"]

[[asserts]]
arguments = [["pine", "pine", "pine", "pine", "pine"]]
comment   = "Five records of the same label"
expected  = ["pine"]

[[asserts]]
arguments = [["maple", "maple", "beech", "beech"]]
comment   = "Two recovered caches"
expected  = []

[[asserts]]
arguments = [["maple", "beech", "maple", "beech", "maple"]]
comment   = "One label recorded three times"
expected  = ["maple"]

[[asserts]]
arguments = [["walnut", "hazel", "walnut", "hazel", "walnut", "hazel"]]
comment   = "All labels appear an even number of times"
expected  = ["hazel", "walnut"]

[[asserts]]
