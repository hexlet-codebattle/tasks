base_score        = 120
level             = "easy"
name              = "digit_sum_range"
tags              = ["math", "digit_sum", "range"]
time_to_solve_sec = 210

description_en = """
Given integers $l$, $r$, and $x$, where $0 \\le l \\le r \\le 10000$, find the smallest and the largest integer
between $l$ and $r$ inclusive whose sum of digits equals $x$. Return the result as
`[minimum, maximum]`. If there is no such number, return `[-1, -1]`.
"""

description_ru = """
По заданным целым числам $l$, $r$ и $x$, где $0 \\le l \\le r \\le 10000$, найдите минимальное и максимальное
число в диапазоне $[l, r]$ включительно, у которого сумма цифр равна $x$. Верните
результат в виде пары `[минимум, максимум]`. Если таких чисел нет, верните
`[-1, -1]`.
"""

solution = """
def solution(l, r, x):
    min_val = None
    max_val = None
    for i in range(l, r + 1):
        if sum(map(int, str(i))) == x:
            if min_val is None:
                min_val = i
            max_val = i
    if min_val is None:
        return [-1, -1]
    return [min_val, max_val]
"""

examples = """
solution(1, 100, 4) == [4, 40]
solution(100, 500, 12) == [129, 480]
solution(1, 10, 20) == [-1, -1]
"""

examples_list = [
  "solution(1, 100, 4) == [4, 40]",
  "solution(100, 500, 12) == [129, 480]",
  "solution(1, 10, 20) == [-1, -1]",
]

