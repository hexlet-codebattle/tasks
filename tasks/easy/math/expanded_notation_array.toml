description_en = """
Expanded Notation means an integer is written as the sum of its digits multiplied with its place value (in strictly descending powers of $10$).

For example, $85063 = 8 \\times 10000 + 5 \\times 1000 + 6 \\times 10 + 3$.

You are given an array of strings `arr`, where each string represents a non-negative integer in expanded notation. The strings use `"x"` for multiplication and `"+"` for addition, with no spaces. Your task is to compute the sum for each string and return an array of these numbers in their normal integer form.

Each term is a single digit multiplied by a power of ten; a units term may omit `x1`. Place values strictly decrease within each string. Each resulting integer is at most $2 \\cdot 10^9$.
"""

description_ru = """
Развернутая запись означает, что целое число записано в виде суммы его цифр, умноженных на их разрядное значение (в строго убывающих степенях $10$).

Например, $85063 = 8 \\times 10000 + 5 \\times 1000 + 6 \\times 10 + 3$.

Вам дан массив строк `arr`, где каждая строка представляет неотрицательное целое число в развернутой записи. В строках используется `"x"` для умножения и `"+"` для сложения, без пробелов. Ваша задача — вычислить сумму для каждой строки и вернуть массив этих чисел в обычном целом виде.

Каждое слагаемое — одна цифра, умноженная на степень десяти; у единиц можно опустить `x1`. Разрядные значения в каждой строке строго убывают. Каждое полученное целое число не превышает $2 \\cdot 10^9$.
"""

description_es = """
Notación expandida significa que un número entero se escribe como la suma de sus dígitos multiplicada por su valor posicional (en potencias estrictamente descendentes de $10$).

Por ejemplo, $85063 = 8 \\times 10000 + 5 \\times 1000 + 6 \\times 10 + 3$.

Se le proporciona una matriz de cadenas `arr`, donde cada cadena representa un número entero no negativo en notación expandida. Las cadenas usan `\"x\"` para multiplicación y `\"+\"` para suma, sin espacios. Su tarea es calcular la suma de cada cadena y devolver una matriz de estos números en su forma entera normal.

Cada término es un solo dígito multiplicado por una potencia de diez; un término de unidades puede omitir `x1`. Los valores posicionales disminuyen estrictamente dentro de cada cadena. Cada número entero resultante es como máximo $2 \\cdot 10^9$.
"""

description_zh = """
扩展表示法意味着整数被写为其数字之和与其位值的乘积（严格为 $10$ 的降幂）。

例如，$85063 = 8 \\times 10000 + 5 \\times 1000 + 6 \\times 10 + 3$。

给您一个字符串数组 `arr`，其中每个字符串代表扩展表示法中的非负整数。字符串使用 `\"x\"` 进行乘法，使用 `\"+\"` 进行加法，没有空格。您的任务是计算每个字符串的总和，并以正常整数形式返回这些数字的数组。

每一项都是一位数乘以十的幂；单位术语可以省略 `x1`。每个字符串中的位值严格递减。每个结果整数最多为 $2 \\cdot 10^9$。
"""

limits = """
- $1 \\leq \\text{len}(arr) \\leq 100$
- $1 \\leq \\text{len}(arr[i]) \\leq 100$
- $0 \\leq \\text{value}(arr[i]) \\leq 2 \\cdot 10^9$
"""

solution = """
def solution(arr: list[str]) -> list[int]:
    def value(term):
        factors = term.split('x')
        return int(factors[0]) * (int(factors[1]) if len(factors) == 2 else 1)
    return [sum(value(term) for term in s.split('+')) for s in arr]
"""

examples = """
solution(["1x1"]) == [1]
solution(["9x10", "1x1"]) == [90, 1]
solution(["7x100+2x1", "8x10000+5x1000+6x10+3"]) == [702, 85063]
"""

