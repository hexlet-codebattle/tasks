base_score        = 100
level             = "easy"
name              = "industrial_alpinist"
tags              = ["math"]
time_to_solve_sec = 210

description_en = """
Industrial climber uses three carabiners for safety. For each carabiner the weight it can hold is known. The safety is considered reliable if at least two carabiners can hold the climber's weight. Determine the maximum weight for which the safety is reliable.
"""

description_ru = """
Промышленный альпинист использует для страховки три карабина. Для каждого карабина известен вес, который он выдерживает. Страховка считается надежной, если хотя бы два карабина выдерживают вес альпиниста. Определите максимальный вес при котором страховка будет надежной.
"""

solution = """
def solution(a, b, c):
    # Return the second largest of the three capacities,
    # which is the maximal weight supported by at least two carabiners.
    return sorted([a, b, c])[1]
"""

examples = """
solution(28, 15, 10) == 15
solution(8, 68, 14) == 14
"""

