base_score        = 100
level             = "easy"
name              = "library_fines"
tags              = ["math", "university"]
time_to_solve_sec = 180

description_en = """
The university library bills a student for every overdue book she returns. The array `days` lists the number of days each borrowed book was overdue; a negative value means the book was returned early.

The fine for a book is $0.25$ per day overdue. Early returns add nothing to the total.

Return the total fine the student owes, rounded to $2$ decimal places.
"""

description_ru = """
Университетская библиотека выставляет студентке штраф за каждую просроченную книгу. Массив `days` содержит число дней просрочки по каждой взятой книге; отрицательное значение означает досрочный возврат.

Штраф за книгу — $0.25$ за каждый просроченный день. Досрочный возврат ничего не добавляет к итогу.

Верните итоговый штраф студентки, округлённый до $2$ знаков после запятой.
"""

limits = """
- $0 \\leq \\text{len}(\\text{days}) \\leq 10^4$
- $-100 \\leq \\text{days}[i] \\leq 1000$
"""

solution = """
def solution(days: list) -> float:
    return round(sum(max(0, d) for d in days) * 0.25, 2)
"""

examples = """
solution([]) == 0.0
solution([4]) == 1.0
solution([-3]) == 0.0
solution([1, 2, 3]) == 1.5
solution([10, -5, 2]) == 3.0
"""

[[input_signature]]
argument_name = "days"
[input_signature.type]
name = "array"
[input_signature.type.nested]
name = "integer"

[output_signature.type]
name = "float"

