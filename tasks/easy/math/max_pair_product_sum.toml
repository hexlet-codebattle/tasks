base_score        = 100
level             = "easy"
name              = "max_pair_product_sum"
tags              = ["math", "pairing", "brute_force", "optimization"]
time_to_solve_sec = 180

description_ru = """
Даны четыре целых числа. Разделите их на две пары так, чтобы сумма произведений чисел в парах была максимальной. Верните эту сумму.
"""

description_en = """
Given four integers, split them into two pairs such that the sum of the products of the numbers in each pair is maximal. Return this maximum sum.
"""

solution = """
def solution(arr):
    a, b, c, d = arr
    # три возможных способа разбить четыре элемента на две пары
    return max(
        a * b + c * d,   # (a,b) и (c,d)
        a * c + b * d,   # (a,c) и (b,d)
        a * d + b * c    # (a,d) и (b,c)
    )
"""

examples = """
solution([2, 3, 4, 5]) == 26
solution([-1, 1, -1, 1]) == 2
"""

