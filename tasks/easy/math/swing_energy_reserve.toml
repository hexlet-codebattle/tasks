base_score        = 80
level             = "easy"
name              = "swing_energy_reserve"
tags              = ["math", "spider_man"]
time_to_solve_sec = 240

description_en = """
Spider-Man visits rooftops in the order of `heights`. Rising by $d$ meters spends $d$ energy. Dropping by $d$ meters restores $\\lfloor d / 2 \\rfloor$ energy. Energy changes only between consecutive rooftops and may never be negative.

Return the minimum integer energy needed before the first move. With fewer than two rooftops, return $0$.
"""

description_ru = """
Человек-паук посещает крыши в порядке массива `heights`. Подъем на $d$ метров расходует $d$ единиц энергии. Спуск на $d$ метров восстанавливает $\\lfloor d / 2 \\rfloor$ единиц. Энергия меняется только между соседними крышами и никогда не может быть отрицательной.

Верните минимальный целый запас энергии перед первым перемещением. Если крыш меньше двух, верните $0$.
"""

limits = """
- $1 \\leq \\text{len}(\\text{heights}) \\leq 10^4$
- $0 \\leq \\text{heights}[i] \\leq 10^6$
"""

solution = """
def solution(heights: list[int]) -> int:
    energy = lowest = 0
    for current, next_height in zip(heights, heights[1:]):
        energy += (current - next_height) // 2 if next_height < current else current - next_height
        lowest = min(lowest, energy)
    return -lowest
"""

examples = """
solution([5]) == 0
solution([0, 5]) == 5
solution([10, 0, 5]) == 0
"""

