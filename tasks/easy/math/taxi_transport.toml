base_score        = 100
level             = "easy"
name              = "taxi_transport"
tags              = ["math", "greedy", "integer", "optimization"]
time_to_solve_sec = 210

description_en = """
In an economy class taxi there are $3$ seats, and in a comfort class taxi there are $4$ seats.
Given an integer $m$, where $0 \\le m \\le 2 \\cdot 10^9$, determine how many economy and comfort taxis to order
to transport exactly $m$ people. No taxi should have empty seats.
If it is impossible, return `[0, 0]`. The total number of ordered taxis must be minimal.
"""

description_ru = """
В такси эконом-класса $3$ места, а в такси комфорт-класса - $4$ места.
Для заданного целого $m$, где $0 \\le m \\le 2 \\cdot 10^9$, определите, сколько такси эконом- и комфорт-класса
нужно заказать, чтобы перевезти ровно $m$ человек. В такси не должно оставаться свободных мест.
Если это невозможно, верните `[0, 0]`. Суммарное количество заказанных машин должно быть минимальным.
"""

description_es = """
En un taxi de clase económica hay asientos $3$, y en un taxi de clase confort hay asientos $4$.
Dado un número entero $m$, donde $0 \\le m \\le 2 \\cdot 10^9$, determine cuántos taxis económicos y confort pedir
para transportar exactamente $m$ personas. Ningún taxi debería tener asientos vacíos.
Si es imposible, devuelva `[0, 0]`. El número total de taxis solicitados debe ser mínimo.
"""

description_zh = """
经济舱出租车有 $3$ 座位，舒适舱出租车有 $4$ 座位。
给定一个整数 $m$，其中 $0 \\le m \\le 2 \\cdot 10^9$，确定要订购多少辆经济型和舒适型出租车
正好运送 $m$ 人。出租车不应该有空座位。
如果不可能，则返回`[0, 0]`。订购出租车的总数必须最少。
"""

solution = """
def solution(m):
    # smallest non‑negative x such that 3*x ≡ m (mod 4)
    x = (-m) % 4
    if 3 * x > m:
        return [0, 0]
    y = (m - 3 * x) // 4
    return [x, y]
"""

examples = """
solution(10) == [2, 1]
solution(1) == [0, 0]
"""

examples_list = [
  "solution(10) == [2, 1]",
  "solution(1) == [0, 0]",
  "solution(7) == [1, 1]",
]

