base_score        = 100
level             = "easy"
name              = "max_speed"
tags              = ["physics", "kinematics", "math"]
time_to_solve_sec = 210

description_en = """
A car moves with initial speed $v_0$. Then it accelerates with acceleration $a_1$ for $t_1$ seconds,
and afterwards it accelerates with acceleration $a_2$ for $t_2$ seconds. Determine the maximum
speed the car reaches during the whole motion.
"""

description_ru = """
Автомобиль двигался со скоростью $v_0$, затем в течение $t_1$ секунд он двигался с ускорением $a_1$,
а затем в течение $t_2$ секунд он двигался с ускорением $a_2$. Определите максимальную скорость,
которую достигал автомобиль.
"""

solution = """
def solution(v0, t1, a1, t2, a2):
    # speed after the first acceleration interval
    v1 = v0 + a1 * t1
    # speed after the second acceleration interval
    v2 = v1 + a2 * t2
    # the maximum of the three possible speeds
    return max(v0, v1, v2)
"""

examples = """
solution(1, 2, 3, 4, 5)   == 27
solution(1, 2, 3, 4, -1)  == 7
"""

examples_list = [
  "solution(1, 2, 3, 4, 5) == 27",
  "solution(1, 2, 3, 4, -1) == 7",
  "solution(10, 5, -1, 5, -1) == 10",
]

