base_score        = 120
level             = "easy"
name              = "race_winner"
tags              = ["simulation", "math"]
time_to_solve_sec = 210

description_en = """
There are $n$ participants in a circular race. The system records each time a participant crosses the finish line, writing down the participant numbers in the order they cross. The race consists of $k$ laps, but the value of $k$ is unknown. Some participants may have dropped out and therefore crossed the finish line fewer than $k$ times, but it is guaranteed that at least one participant completed all $k$ laps. Determine the participant who completed $k$ laps first.
"""

description_ru = """
В кольцевых гонках участвовало $n$ участников. Система фиксировала каждое пересечение участником финишной прямой, записывая номера участников в том порядке, в котором они ее пересекали. Гонка состоит из $k$ кругов, однако число $k$ неизвестно. Некоторые участники могли выбыть и пройти меньше $k$ кругов, однако гарантируется, что хотя бы один участник прошел все $k$ кругов. Определите участника, который прошел $k$ кругов первым.
"""

solution = """
def solution(n, a):
    # Compute total occurrences of each participant.
    total_counts = {}
    for x in a:
        total_counts[x] = total_counts.get(x, 0) + 1

    # k is the maximal total count.
    k = max(total_counts.values())

    # Find the first participant whose running count reaches k.
    cur = {}
    for x in a:
        cur[x] = cur.get(x, 0) + 1
        if cur[x] == k:
            return x
    # According to the statement this line is never reached.
    return -1
"""

examples = """
solution(3, [1, 3, 3, 1]) == 3
solution(3, [1, 1, 2, 3, 1]) == 1
"""

examples_list = [
  "solution(3, [1, 3, 3, 1]) == 3",
  "solution(3, [1, 1, 2, 3, 1]) == 1",
  "solution(3, [1, 2, 3, 3, 2, 1]) == 3",
]

