base_score        = 90
level             = "easy"
name              = "attendance_streak"
tags              = ["strings", "university"]
time_to_solve_sec = 160

description_en = """
A teaching assistant tracks a student's attendance across the term as a string `log` of `'P'` (present) and `'A'` (absent) characters, one per class.

The dean awards a "perfect streak" bonus based on the longest run of consecutive `'P'` characters in the log.

Return the length of that longest run, or $0$ if the student was never present.
"""

description_ru = """
Ассистент кафедры отслеживает посещаемость студента в течение семестра в виде строки `log` из символов `'P'` (присутствует) и `'A'` (отсутствует) — по одному на занятие.

Декан назначает бонус за «идеальную серию», основанный на длине самой длинной серии подряд идущих `'P'`.

Верните длину этой серии или $0$, если студент ни разу не присутствовал.
"""

description_es = """
Un asistente de enseñanza realiza un seguimiento de la asistencia de un estudiante a lo largo del semestre como una cadena `log` de caracteres `'P'` (presente) y `'A'` (ausente), uno por clase.

El decano otorga una bonificación por \"racha perfecta\" basada en la serie más larga de caracteres `'P'` consecutivos en el registro.

Devuelve la duración de esa carrera más larga, o $0$ si el estudiante nunca estuvo presente.
"""

description_zh = """
助教用字符串 `log` 记录学生一学期的出勤情况，每节课对应一个字符：`'P'` 表示出勤，`'A'` 表示缺勤。

院长根据日志中最长的连续 `'P'` 段颁发连续全勤奖励。

返回该连续段的长度；如果学生从未出勤，则返回 $0$。
"""

limits = """
- $0 \\leq \\text{len}(\\text{log}) \\leq 10^4$
- $\\text{log} \\in \\{\\text{"P"}, \\text{"A"}\\}^*$
"""

solution = """
def solution(log: str) -> int:
    best = cur = 0
    for c in log:
        cur = cur + 1 if c == "P" else 0
        best = max(best, cur)
    return best
"""

examples = """
solution("") == 0
solution("P") == 1
solution("AAA") == 0
solution("PPAP") == 2
solution("APPPA") == 3
"""

