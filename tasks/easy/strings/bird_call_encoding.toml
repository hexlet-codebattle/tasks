base_score        = 60
level             = "easy"
name              = "bird_call_encoding"
tags              = ["strings", "linear_scan"]
time_to_solve_sec = 200

description_en = """
Contact calls keep a flock together, while alarm calls warn about danger. In a bioacoustic recording `C` marks a contact call, `A` an alarm call and `S` silence.

Compress every maximal block of equal consecutive events into the event character followed by the block length written in decimal, and return the resulting string. An empty recording gives an empty string.
"""

description_ru = """
Контактные позывы помогают птицам держаться стаей, а тревожные предупреждают об опасности. В записи биоакустика `C` обозначает контактный позыв, `A` — тревожный, `S` — тишину.

Сожмите каждую максимальную группу подряд идущих одинаковых событий в символ события и длину группы в десятичной записи и верните полученную строку. Для пустой записи верните пустую строку.
"""

limits = """
- $0 \\leq \\text{len}(\\text{recording}) \\leq 10^4$
- $\\text{recording}[i] \\in \\{C, A, S\\}$
"""

solution = """
def solution(recording: str) -> str:
    groups = []
    for event in recording:
        if groups and groups[-1][0] == event:
            groups[-1][1] += 1
        else:
            groups.append([event, 1])
    return "".join(f"{event}{count}" for event, count in groups)
"""

examples = """
solution("") == ""
solution("CAS") == "C1A1S1"
solution("CCAAS") == "C2A2S1"
"""

[[input_signature]]
argument_name = "recording"
[input_signature.type]
name = "string"

[output_signature.type]
name = "string"

