base_score        = 100
level             = "easy"
name              = "christmas_tree"
tags              = ["strings", "output_format", "construction"]
time_to_solve_sec = 300

description_en = """
Draw a Christmas tree with $k$ levels. The $i$-th level consists of $i + 1$ rows.
In the first row there is one asterisk, in the second row there are three, and in the $j$-th row there are $2j - 1$ asterisks.
All rows are centered, and cells not occupied by the tree must be filled with the character `"."`.
Return the drawing as an array of strings, each string representing a line.
"""

description_ru = """
Нарисуйте елочку из $k$ уровней. $i$-й уровень елочки состоит из $i + 1$ строк.
В первой строке содержится каждого уровня один символ `"*"`, во второй - три, а в $j$-й строке содержится $2j - 1$ символов `"*"`.
Середины всех строк совпадают, а незанятые елочкой клетки должны быть заполнены символом `"."`.
Верните рисунок в виде массива строк, каждая строка - отдельная строка вывода.
"""

description_es = """
Dibuja un árbol de Navidad con niveles $k$. El nivel $i$-ésimo consta de filas $i + 1$.
En la primera fila hay un asterisco, en la segunda fila hay tres y en la fila $j$ hay asteriscos $2j - 1$.
Todas las filas están centradas y las celdas que no están ocupadas por el árbol deben rellenarse con el carácter `\".\"`.
Devuelve el dibujo como una matriz de cadenas, cada cadena representa una línea.
"""

description_zh = """
绘制一棵具有 $k$ 级别的圣诞树。第 $i$ 层由 $i + 1$ 行组成。
第一行有一个星号，第二行有三个星号，第 $j$ 行有 $2j - 1$ 星号。
所有行均居中，未被树占用的单元格必须用字符 `\".\"` 填充。
将绘图作为字符串数组返回，每个字符串代表一条线。
"""

solution = """
def solution(k):
    # width of the whole picture (the widest line)
    width = 2 * k + 1
    res = []
    for i in range(1, k + 1):          # level number
        for j in range(1, i + 2):      # rows in the level (i+1 rows)
            stars = 2 * j - 1
            pad = (width - stars) // 2
            line = '.' * pad + '*' * stars + '.' * pad
            res.append(line)
    return res
"""

examples = """
solution(1) == [".*.", "***"]
solution(2) == ["..*..", ".***.", "..*..", ".***.", "*****"]
"""

