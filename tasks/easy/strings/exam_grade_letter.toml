level             = "easy"
name              = "exam_grade_letter"
tags              = ["strings", "university"]
time_to_solve_sec = 180

description_en = """
A professor enters a student's final exam `score` (an integer from $0$ to $100$) into the gradebook and the system prints out the matching letter grade.

Return the letter grade for the given `score` using the standard scale:

- `"A"` if $\\text{score} \\geq 90$
- `"B"` if $\\text{score} \\geq 80$
- `"C"` if $\\text{score} \\geq 70$
- `"D"` if $\\text{score} \\geq 60$
- `"F"` otherwise
"""

description_ru = """
Профессор вносит итоговый балл `score` за экзамен (целое число от $0$ до $100$) в журнал, и система выводит соответствующую буквенную оценку.

Верните буквенную оценку для заданного `score` по стандартной шкале:

- `"A"`, если $\\text{score} \\geq 90$
- `"B"`, если $\\text{score} \\geq 80$
- `"C"`, если $\\text{score} \\geq 70$
- `"D"`, если $\\text{score} \\geq 60$
- `"F"` иначе
"""

limits = """
- $0 \\leq \\text{score} \\leq 100$
"""

solution = """
def solution(score: int) -> str:
    for t, g in ((90, "A"), (80, "B"), (70, "C"), (60, "D")):
        if score >= t:
            return g
    return "F"
"""

examples = """
solution(0) == "F"
solution(95) == "A"
solution(72) == "C"
solution(60) == "D"
solution(100) == "A"
"""

[[input_signature]]
argument_name = "score"
[input_signature.type]
name = "integer"

[output_signature.type]
name = "string"

