base_score        = 100
level             = "easy"
name              = "hole_letters"
tags              = ["strings", "counting", "implementation"]
time_to_solve_sec = 210

description_en = """
To combat trypophobia (fear of holes), it was decided to remove all lowercase (small) letters containing "holes" (such as "g", "q", "a", "b", etc.) from the English alphabet, while leaving letters without "holes" (such as "w", "k", etc.). Determine how many letters will be removed from the string."""

description_ru = """
Для борьбы с трипофобией (боязнью отверстий) из английского алфавита было решено удалить все строчные (маленькие) буквы, содержащие "полости" (такие как "g", "q", "a", "b" и т.д.), а буквы без "полостей" решено оставить (такие как "w", "k" и т.д.). Определите, сколько букв будет удалено из строки.
"""

solution = """
def solution(s):
    holes = set('abdegopq')
    return sum(1 for ch in s if ch in holes)
"""

examples = """
solution("code battle") == 6
solution("abcdefghijklmnopqrstuvwxyz") == 8
"""

examples_list = [
  'solution("code battle") == 6',
  'solution("abcdefghijklmnopqrstuvwxyz") == 8',
  'solution("xyz") == 0',
]

