base_score        = 100
level             = "easy"
name              = "lost_participant"
tags              = ["strings"]
time_to_solve_sec = 210

description_en = """
According to the new rules for the University Battle finals, participants must simultaneously program and run a marathon through the forest.
One participant did not make it to the finish line.
Using the lists of starters and finishers, identify the name of the participant lost in the forest (the names of the participants may be the same).
"""

description_ru = """
По новым правилам финала баттла вузов участники должны одновременно программировать и бежать марафон по лесу.
Один из участников не добежал до финиша.
По спискам стартовавших и финишировавших участников определите имя потерявшегося в лесу участника (имена участников могут совпадать).
"""

solution = """
def solution(participants, finishers):
    from collections import Counter
    cnt = Counter(participants)
    cnt.subtract(finishers)
    for name, diff in cnt.items():
        if diff:
            return name
"""

examples = """
solution(["Vasya","Masha","Petya"], ["Petya","Masha"]) == "Vasya"
solution(["Vasya","Vasya","Vasya"], ["Vasya","Vasya"]) == "Vasya"
"""

examples_list = [
  'solution(["Vasya","Masha","Petya"], ["Petya","Masha"]) == "Vasya"',
  'solution(["Vasya","Vasya","Vasya"], ["Vasya","Vasya"]) == "Vasya"',
  'solution(["ann", "bob"], ["ann"]) == "bob"',
]

