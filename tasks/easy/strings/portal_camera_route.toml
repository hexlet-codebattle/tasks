base_score        = 70
level             = "easy"
name              = "portal_camera_route"
tags              = ["strings", "spider_man"]
time_to_solve_sec = 210

description_en = """
A camera drone records Spider-Man's route as `N`, `E`, `S`, and `W` commands. A portal rotates every recorded direction $90^\\circ$ clockwise, then plays the clip backward.

Return the command string seen in the portal: rotate every command using `N` $\\to$ `E` $\\to$ `S` $\\to$ `W` $\\to$ `N`, then reverse their order. The empty route remains empty.
"""

description_ru = """
Дрон записывает маршрут Человека-паука командами `N`, `E`, `S` и `W`. Портал поворачивает каждое записанное направление на $90^\\circ$ по часовой стрелке, а затем проигрывает запись задом наперед.

Верните строку команд, видимую в портале: замените каждую команду по правилу `N` $\\to$ `E` $\\to$ `S` $\\to$ `W` $\\to$ `N`, затем разверните их порядок. Пустой маршрут остается пустым.
"""

description_es = """
Un dron con cámara registra la ruta de Spider-Man como comandos `N`, `E`, `S` y `W`. Un portal gira cada dirección grabada $90^\\circ$ en el sentido de las agujas del reloj y luego reproduce el clip hacia atrás.

Devuelva la cadena de comando que se ve en el portal: gire cada comando usando `N` $\\to$ `E` $\\to$ `S` $\\to$ `W` $\\to$ `N`, luego invierta su orden. La ruta vacía permanece vacía.
"""

description_zh = """
无人机将蜘蛛侠的路线记录为 `N`、`E`、`S` 和 `W` 命令。门户顺时针旋转每个记录的方向 $90^\\circ$，然后向后播放剪辑。

返回在门户中看到的命令字符串：使用 `N` $\\to$ `E` $\\to$ `S` $\\to$ `W` $\\to$ 旋转每个命令`N`，然后颠倒顺序。空的路线仍然是空的。
"""

limits = """
- $0 \\leq \\text{len}(\\text{route}) \\leq 10^4$
- $\\text{route} \\in \\{N,E,S,W\\}^*$
"""

solution = """
def solution(route: str) -> str:
    turn = {"N": "E", "E": "S", "S": "W", "W": "N"}
    return "".join(turn[command] for command in reversed(route))
"""

examples = """
solution("") == ""
solution("NE") == "SE"
solution("NESW") == "NWSE"
"""

