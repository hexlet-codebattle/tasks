base_score        = 85
level             = "easy"
name              = "trailer_spoiler_mask"
tags              = ["strings", "spider_man"]
time_to_solve_sec = 250

description_en = """
The studio marks spoiler spans in trailer text `text`. Every pair `[left, right]` denotes the half-open character interval $[\\text{left}, \\text{right})$.

Replace every character covered by at least one span with `*` and return the result. Spans may overlap, touch, be empty, and cover spaces. Uncovered characters keep their original positions.
"""

description_ru = """
Студия отмечает спойлеры в тексте трейлера `text`. Каждая пара `[left, right]` задает полуинтервал символов $[\\text{left}, \\text{right})$.

Замените каждый символ, покрытый хотя бы одним отрезком, на `*` и верните результат. Отрезки могут пересекаться, соприкасаться, быть пустыми и покрывать пробелы. Непокрытые символы остаются на своих позициях.
"""

limits = """
- $0 \\leq \\text{len}(\\text{text}) \\leq 10^4$
- $0 \\leq \\text{len}(\\text{spans}) \\leq 10^3$
- $0 \\leq \\text{left} \\leq \\text{right} \\leq \\text{len}(\\text{text})$
"""

solution = """
def solution(text: str, spans: list[list[int]]) -> str:
    result = list(text)
    for left, right in spans:
        result[left:right] = "*" * (right - left)
    return "".join(result)
"""

examples = """
solution("Hero", []) == "Hero"
solution("Hero", [[0, 4]]) == "****"
solution("Spider Man", [[7, 10]]) == "Spider ***"
"""

[[input_signature]]
