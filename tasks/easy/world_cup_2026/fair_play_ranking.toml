base_score        = 80
level             = "easy"
name              = "fair_play_ranking"
tags              = ["world_cup_2026", "sorting"]
time_to_solve_sec = 200

description_en = """
Each team record is `[points, goal_difference, goals_scored, penalty_points]`.
Return team indices in table order: more points, better goal difference, more goals scored, fewer penalty points, then smaller original index.
"""

description_ru = """
Показатели команды заданы как `[points, goal_difference, goals_scored, penalty_points]`.
Верните индексы в порядке таблицы: больше очков, лучше разница голов, больше забитых голов, меньше штрафных баллов, затем меньший исходный индекс.
"""

limits = """
- $0 \\leq \\operatorname{len}(records) \\leq 48$
- $\\operatorname{len}(records_i) = 4$
- $0 \\leq points_i \\leq 9$
- $-20 \\leq goal\\_difference_i \\leq 20$
- $0 \\leq goals\\_scored_i \\leq 20$
- $0 \\leq penalty\\_points_i \\leq 100$
"""

solution = """
def solution(records: list[list[int]]) -> list[int]:
    return sorted(
        range(len(records)),
        key=lambda i: (-records[i][0], -records[i][1],
                       -records[i][2], records[i][3], i),
    )
"""

examples = """
solution([]) == []
solution([[3, 0, 1, 2]]) == [0]
solution([[3, 1, 2, 4], [3, 1, 2, 1]]) == [1, 0]
"""

