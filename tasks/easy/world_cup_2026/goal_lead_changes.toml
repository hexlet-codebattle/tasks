base_score        = 80
level             = "easy"
name              = "goal_lead_changes"
tags              = ["world_cup_2026", "strings"]
time_to_solve_sec = 200

description_en = """
The string `goals` lists scoring teams in chronological order using `A` and `B`.
Count how many times the lead passes from one team to the other.

The first team to take the lead does not count as a change.
A tied score is not a separate leader, so `A leads -> tie -> B leads` counts as one lead change.
"""

description_ru = """
Строка `goals` хранит авторов голов по порядку с помощью символов `A` и `B`.
Посчитайте, сколько раз лидерство переходит от одной команды к другой.

Первый выход команды вперед не считается сменой лидера.
Ничья не считается отдельным лидером, поэтому переход `A лидирует -> ничья -> B лидирует` считается одной сменой.
"""

description_es = """
La cadena `goals` enumera los equipos puntuadores en orden cronológico utilizando `A` y `B`.
Cuente cuántas veces la ventaja pasa de un equipo a otro.

El primer equipo que tome la delantera no cuenta como cambio.
Un puntaje empatado no es un líder separado, por lo que `A leads -> tie -> B leads` cuenta como un cambio de líder.
"""

description_zh = """
字符串 `goals` 使用 `A` 和 `B` 按时间顺序列出得分团队。
计算领先优势从一支球队转移到另一支球队的次数。

最先取得领先的队伍不算作换人。
平局得分并不是单独的领先者，因此 `A leads -> tie -> B leads` 算作一次领先变化。
"""

limits = """
- $0 \\leq \\operatorname{len}(goals) \\leq 30$
- $goals \\in \\{A, B\\}^*$
"""

solution = """
def solution(goals: str) -> int:
    a = b = leader = changes = 0
    for goal in goals:
        a += goal == "A"
        b += goal == "B"
        new = (a > b) - (a < b)
        if new and leader and new != leader:
            changes += 1
        if new:
            leader = new
    return changes
"""

examples = """
solution("") == 0
solution("AAAA") == 0
solution("ABBAA") == 2
"""

