base_score        = 80
level             = "easy"
name              = "penalty_shootout_clinch"
tags              = ["world_cup_2026", "simulation"]
time_to_solve_sec = 200

description_en = """
The string `kicks` contains a prefix of the ten-kick regulation shootout, starting with team A and alternating between the teams.
Each team may take at most five kicks: `1` is a goal and `0` is a miss.

Return the first kick number after which one team has an insurmountable lead, even if later kicks are present in the string.
Return `0` if the shootout is not decided within the given prefix. Sudden death is not considered.
"""

description_ru = """
Строка `kicks` содержит префикс основной серии из десяти пенальти, начиная с команды A и чередуя команды.
Каждая команда может выполнить не более пяти ударов: `1` — гол, `0` — промах.

Верните номер первого удара, после которого одна из команд получила недосягаемое преимущество, даже если в строке записаны последующие удары.
Верните `0`, если серия не решена в данном префиксе. Серия дополнительных ударов не рассматривается.
"""

limits = """
- $0 \\leq \\operatorname{len}(kicks) \\leq 10$
- $kicks \\in \\{0, 1\\}^*$
"""

solution = """
def solution(kicks: str) -> int:
    a = b = taken_a = taken_b = 0
    for i, kick in enumerate(kicks):
        if i % 2 == 0:
            taken_a += 1
            a += kick == "1"
        else:
            taken_b += 1
            b += kick == "1"
        if a > b + 5 - taken_b or b > a + 5 - taken_a:
            return i + 1
    return 0
"""

examples = """
solution("") == 0
solution("101010") == 6
solution("111110000") == 9
"""

