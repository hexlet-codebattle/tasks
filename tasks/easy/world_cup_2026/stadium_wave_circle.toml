base_score        = 80
level             = "easy"
name              = "stadium_wave_circle"
tags              = ["world_cup_2026", "strings"]
time_to_solve_sec = 200

description_en = """
A circular stadium row is encoded with `W` for a standing fan and `.` for a seated fan.
Return the longest continuous wave, allowing it to cross the end of the string.
The wave cannot contain the same seat more than once. For an empty row, return `0`.
"""

description_ru = """
Круговой ряд стадиона задан строкой: `W` — вставший болельщик, `.` — сидящий.
Верните длину самой длинной непрерывной волны с учетом перехода через конец строки.
Одно место нельзя включать в волну несколько раз. Для пустого ряда верните `0`.
"""

limits = """
- $0 \\leq \\operatorname{len}(seats) \\leq 1000$
- $seats \\in \\{W, .\\}^*$
"""

solution = """
def solution(seats: str) -> int:
    if not seats:
        return 0
    return min(len(seats), max(map(len, (seats + seats).split("."))))
"""

examples = """
solution("") == 0
solution("WWW") == 3
solution("WW..W") == 3
"""

