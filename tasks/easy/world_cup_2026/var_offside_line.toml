base_score        = 80
level             = "easy"
name              = "var_offside_line"
tags              = ["world_cup_2026", "arrays"]
time_to_solve_sec = 200

description_en = """
Positions use a pitch from `0` to `100`.
If `attack_right` is `true`, the attack moves toward `100`; otherwise it moves toward `0`.

Return, in ascending order, the indices of attackers who are strictly closer to the opposing goal than the halfway line, the ball, and the second-last defender.
An attacker exactly on any of these lines is onside.
"""

description_ru = """
Координаты заданы на поле от `0` до `100`.
Если `attack_right` равно `true`, команда атакует в сторону `100`, иначе — в сторону `0`.

Верните по возрастанию индексы нападающих, которые строго ближе к чужим воротам, чем средняя линия, мяч и предпоследний защитник.
Нападающий точно на любой из этих линий не находится вне игры.
"""

limits = """
- $0 \\leq \\operatorname{len}(attackers) \\leq 11$
- $0 \\leq attackers_i \\leq 100$
- $0 \\leq ball \\leq 100$
- $0 \\leq defender \\leq 100$
"""

solution = """
def solution(attackers, ball, defender, attack_right):
    def pos(x):
        return x if attack_right else 100 - x
    line = max(50, pos(ball), pos(defender))
    return [i for i, x in enumerate(attackers) if pos(x) > line]
"""

examples = """
solution([], 50, 50, True) == []
solution([40, 60], 50, 50, True) == [1]
solution([20, 30, 80], 30, 25, False) == [0]
"""

