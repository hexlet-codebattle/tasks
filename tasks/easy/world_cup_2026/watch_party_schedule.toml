base_score        = 80
level             = "easy"
name              = "watch_party_schedule"
tags              = ["world_cup_2026", "greedy"]
time_to_solve_sec = 200

description_en = """
Each match broadcast is `[start, end]`, measured in minutes from the start of the tournament.
Choose a maximum-size set of broadcasts that can be watched completely without overlaps.
A broadcast may start exactly when the previous one ends.

List chosen matches in viewing order.
If several maximum schedules exist, choose the one whose sequence of pairs `(end, original_index)` is lexicographically smallest.
Return its original indices.
"""

description_ru = """
Каждая трансляция задана как `[start, end]`, где время измеряется в минутах от начала турнира.
Выберите максимальное число трансляций, которые можно полностью посмотреть без пересечений.
Следующий матч может начаться точно в момент окончания предыдущего.

Перечислите выбранные матчи в порядке просмотра.
Если существует несколько максимальных расписаний, выберите расписание с лексикографически наименьшей последовательностью пар `(end, original_index)`.
Верните исходные индексы матчей из этого расписания.
"""

limits = """
- $0 \\leq \\operatorname{len}(matches) \\leq 104$
- $\\operatorname{len}(matches_i) = 2$
- $0 \\leq start_i < end_i \\leq 60000$
"""

solution = """
def solution(matches: list[list[int]]) -> list[int]:
    order = sorted(range(len(matches)), key=lambda i: (matches[i][1], i))
    selected, last_end = [], None
    for i in order:
        if last_end is None or matches[i][0] >= last_end:
            selected.append(i)
            last_end = matches[i][1]
    return selected
"""

examples = """
solution([]) == []
solution([[0, 90]]) == [0]
solution([[0, 90], [90, 180]]) == [0, 1]
"""

