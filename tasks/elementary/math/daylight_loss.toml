base_score        = 20
level             = "elementary"
name              = "daylight_loss"
tags              = ["math", "time"]
time_to_solve_sec = 60

description_en = """
Photoperiod is the length of the light part of a day. Two observations are given as `september` and `october`, each a two-element array `[sunrise, sunset]` in minutes after midnight with `sunrise` $<$ `sunset`. The length of a day equals `sunset` $-$ `sunrise`.

Return by how many minutes the October day is shorter than the September one. The value is negative when the October day is longer.
"""

description_ru = """
Фотопериод — продолжительность светлой части суток. Два наблюдения заданы массивами `september` и `october`, каждый из двух элементов `[sunrise, sunset]` в минутах от полуночи, причём `sunrise` $<$ `sunset`. Продолжительность дня равна `sunset` $-$ `sunrise`.

Верните, на сколько минут октябрьский день короче сентябрьского. Значение отрицательно, если октябрьский день длиннее.
"""

description_es = """
El fotoperiodo es la duración de la parte luminosa del día. Se dan dos observaciones como `september` y `october`, cada una de ellas una matriz de dos elementos `[sunrise, sunset]` en minutos después de la medianoche con `sunrise` $<$ `sunset`. La duración de un día es igual a `sunset` $-$ `sunrise`.

Calcula cuántos minutos el día de octubre es más corto que el de septiembre. El valor es negativo cuando el día de octubre es más largo.
"""

description_zh = """
光周期是一天中有光部分的长度。两个观测值给出为 `september` 和 `october`，每个观测值都是午夜后几分钟内的二元素数组 `[sunrise, sunset]`，其中 `sunrise` $<$ `sunset`。一天的长度等于 `sunset` $-$ `sunrise`。

返回十月的一天比九月的一天短多少分钟。当 10 月白天较长时，该值为负值。
"""

limits = """
- $\\text{len}(\\text{september}) = \\text{len}(\\text{october}) = 2$
- $0 \\leq \\text{september}[0] < \\text{september}[1] \\leq 1439$
- $0 \\leq \\text{october}[0] < \\text{october}[1] \\leq 1439$
"""

solution = """
def solution(september: list[int], october: list[int]) -> int:
    return september[1] - september[0] - october[1] + october[0]
"""

examples = """
solution([390, 1080], [400, 1070]) == 20
solution([360, 1110], [420, 1020]) == 150
solution([400, 1000], [380, 1030]) == -50
"""

