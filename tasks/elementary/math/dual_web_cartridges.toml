base_score        = 45
level             = "elementary"
name              = "dual_web_cartridges"
tags              = ["math", "spider_man"]
time_to_solve_sec = 120

description_en = """
Spider-Man fires `shots` web shots, alternating shooters: left, right, left, right, and so on. Each cartridge supplies exactly `capacity` shots to the shooter in which it is installed. The two shooters do not share cartridges.

Return the total number of cartridges that must be installed across both shooters. A shooter that is never fired needs no cartridge.
"""

description_ru = """
Человек-паук делает `shots` выстрелов паутиной, чередуя устройства: левое, правое, левое, правое и так далее. Один картридж дает ровно `capacity` выстрелов из того устройства, в которое он установлен. Устройства не используют общие картриджи.

Верните общее количество картриджей, которые потребуется установить в оба устройства. Если устройство ни разу не используется, картридж для него не нужен.
"""

limits = """
- $0 \\leq \\text{shots} \\leq 10^9$
- $1 \\leq \\text{capacity} \\leq 10^6$
"""

solution = """
def solution(shots: int, capacity: int) -> int:
    return ((shots + 1) // 2 + capacity - 1) // capacity + (shots // 2 + capacity - 1) // capacity
"""

examples = """
solution(0, 5) == 0
solution(9, 5) == 2
solution(11, 5) == 3
"""

