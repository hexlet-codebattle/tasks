level             = "elementary"
name              = "gpa_average"
tags              = ["math", "university"]
time_to_solve_sec = 150

description_en = """
A university registrar collects the grade points a student earned this semester into an array `grades`, where each value lies between $0.0$ and $4.0$.

Return the student's GPA, computed as the average of `grades` rounded to $2$ decimal places.

If `grades` is empty, return $0.0$.
"""

description_ru = """
Регистратор университета собирает баллы, полученные студентом за семестр, в массив `grades`, где каждое значение лежит между $0.0$ и $4.0$.

Верните средний балл студента — среднее массива `grades`, округлённое до $2$ знаков после запятой.

Если `grades` пуст, верните $0.0$.
"""

limits = """
- $0 \\leq \\text{len}(\\text{grades}) \\leq 10^4$
- $0.0 \\leq \\text{grades}[i] \\leq 4.0$
"""

solution = """
def solution(grades: list) -> float:
    return round(sum(grades) / len(grades), 2) if grades else 0.0
"""

examples = """
solution([]) == 0.0
solution([4.0]) == 4.0
solution([3.0, 4.0]) == 3.5
solution([2.0, 3.5, 4.0]) == 3.17
solution([1.0, 2.0, 3.0, 4.0]) == 2.5
"""

[[input_signature]]
argument_name = "grades"
[input_signature.type]
name = "array"
[input_signature.type.nested]
name = "float"

[output_signature.type]
name = "float"

