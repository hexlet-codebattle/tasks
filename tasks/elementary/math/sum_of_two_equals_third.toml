level             = "easy"
name              = "sum_of_two_equals_third"
tags              = ["math", "collections"]
time_to_solve_sec = 60

description_en = """
Given three integers, determine whether the sum of two of them equals the third one.

Return `True` if such a pair exists, otherwise return `False`.
"""

description_ru = """
Даны три целых числа. Определите, существует ли пара чисел, сумма которых равна третьему.

Верните `True`, если такая пара существует, иначе `False`.
"""

limits = """
- $-10^9 \\leq x, y, z \\leq 10^9$
"""

solution = """
def solution(x: int, y: int, z: int) -> bool:
    return x + y == z or x + z == y or y + z == x
"""

examples = """
solution(3, 1, 2) == True
solution(2, 3, 4) == False
solution(-7, -2, 5) == True
"""

