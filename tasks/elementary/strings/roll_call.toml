base_score        = 70
level             = "elementary"
name              = "roll_call"
tags              = ["strings", "university"]
time_to_solve_sec = 130

description_en = """
A professor takes attendance and writes the result as a string `log`, where `'P'` marks a present student and `'A'` marks an absent one.

Return the number of present students.
"""

description_ru = """
Профессор отмечает посещаемость и записывает результат строкой `log`, где `'P'` означает присутствующего студента, а `'A'` — отсутствующего.

Верните количество присутствующих студентов.
"""

limits = """
- $0 \\leq \\text{len}(\\text{log}) \\leq 10^4$
- $\\text{log} \\in \\{\\text{"P"}, \\text{"A"}\\}^*$
"""

solution = """
def solution(log: str) -> int:
    return log.count("P")
"""

examples = """
solution("") == 0
solution("P") == 1
solution("AA") == 0
solution("PAPA") == 2
solution("PPAAP") == 3
"""

[[input_signature]]
argument_name = "log"
[input_signature.type]
name = "string"

[output_signature.type]
name = "integer"

