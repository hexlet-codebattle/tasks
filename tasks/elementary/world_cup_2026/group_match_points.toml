base_score        = 40
level             = "elementary"
name              = "group_match_points"
tags              = ["world_cup_2026", "math"]
time_to_solve_sec = 100

description_en = """
Given the goals scored by teams A and B, return their tournament points as `[points_a, points_b]`: three for a win, one for a draw, and zero for a loss.
"""

description_ru = """
По числу голов команд A и B верните их турнирные очки в виде `[points_a, points_b]`: три за победу, одно за ничью и ноль за поражение.
"""

limits = """
- $0 \\leq a \\leq 20$
- $0 \\leq b \\leq 20$
"""

solution = """
def solution(a: int, b: int) -> list[int]:
    return [1, 1] if a == b else ([3, 0] if a > b else [0, 3])
"""

examples = """
solution(0, 0) == [1, 1]
solution(2, 0) == [3, 0]
solution(1, 3) == [0, 3]
"""

