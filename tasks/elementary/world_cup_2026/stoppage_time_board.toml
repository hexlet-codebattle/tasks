base_score        = 40
level             = "elementary"
name              = "stoppage_time_board"
tags              = ["world_cup_2026", "math"]
time_to_solve_sec = 100

description_en = """
The scoreboard shows base minute `base_minute`, which is either `45` or `90`.
Given the number of seconds played after it, return the displayed minute.

If `extra_seconds` is `0`, return the base minute without a suffix.
Otherwise, every started extra minute is shown as a full minute: for example, `121` seconds after minute `90` is displayed as `"90+3"`.
"""

description_ru = """
На табло указана основная минута `base_minute`: `45` или `90`.
По числу сыгранных после нее секунд верните отображаемую минуту.

Если `extra_seconds` равно `0`, верните основную минуту без суффикса.
Иначе каждая начавшаяся дополнительная минута считается полной: например, `121` секунда после минуты `90` отображается как `"90+3"`.
"""

limits = """
- $base\\_minute \\in \\{45, 90\\}$
- $0 \\leq extra\\_seconds \\leq 900$
"""

solution = """
def solution(base_minute: int, extra_seconds: int) -> str:
    if extra_seconds == 0:
        return str(base_minute)
    return f"{base_minute}+{(extra_seconds + 59) // 60}"
"""

examples = """
solution(45, 0) == "45"
solution(45, 60) == "45+1"
solution(90, 121) == "90+3"
"""

