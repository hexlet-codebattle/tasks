description_en = """
Two universes show a lineup of identities in arrays `original` and `target`. One move swaps two adjacent entries of `original`. Names may repeat, and equal occurrences are indistinguishable.

Return the minimum number of moves needed to obtain `target`. If the arrays contain different multisets of names, return $-1$.
"""

description_ru = """
Две вселенные показывают порядок личностей в массивах `original` и `target`. За один ход можно поменять местами два соседних элемента `original`. Имена могут повторяться, а одинаковые вхождения неразличимы.

Верните минимальное количество ходов для получения `target`. Если массивы содержат разные мультимножества имен, верните $-1$.
"""

description_es = """
Dos universos muestran una alineación de identidades en las matrices `original` y `target`. Un movimiento intercambia dos entradas adyacentes de `original`. Los nombres pueden repetirse y las apariciones iguales son indistinguibles.

Devuelve el número mínimo de movimientos necesarios para obtener `target`. Si las matrices contienen diferentes conjuntos múltiples de nombres, devuelva $-1$.
"""

description_zh = """
两个 Universe 在数组 `original` 和 `target` 中显示一系列身份。一步操作交换 `original` 的两个相邻条目。名称可能会重复，并且相同的出现是无法区分的。

返回获得 `target` 所需的最小移动次数。如果数组包含不同的多组名称，则返回 $-1$。
"""

limits = """
- $0 \\leq \\text{len}(\\text{original}), \\text{len}(\\text{target}) \\leq 5000$
- $1 \\leq \\text{len}(\\text{original}[i]), \\text{len}(\\text{target}[i]) \\leq 30$
"""

solution = """
def solution(original: list[str], target: list[str]) -> int:
    positions = {}
    for index, name in enumerate(original):
        positions.setdefault(name, []).append(index)
    used, order = {}, []
    for name in target:
        occurrence = used.get(name, 0)
        if name not in positions or occurrence == len(positions[name]):
            return -1
        order.append(positions[name][occurrence])
        used[name] = occurrence + 1
    if len(order) != len(original):
        return -1
    tree, answer = [0] * (len(order) + 1), 0
    for seen, position in enumerate(order):
        index, before = position + 1, 0
        while index:
            before += tree[index]
            index -= index & -index
        answer += seen - before
        index = position + 1
        while index <= len(order):
            tree[index] += 1
            index += index & -index
    return answer
"""

examples = """
solution([], []) == 0
solution(["A", "B"], ["B", "A"]) == 1
solution(["A", "B", "C"], ["C", "B", "A"]) == 3
"""

