base_score        = 250
level             = "hard"
name              = "final_round_pairing"
tags              = ["chess", "bitmasks"]
time_to_solve_sec = 900

description_en = """
Players are numbered from $0$ to $n-1$, where $n$ is the length of `ratings`. A rating is an integer representing a player's strength. `played` lists unordered pairs of players who have already faced each other; either index order may be used.

For the final round, split **all** players into pairs. Every player must appear in exactly one pair, and no pair listed in `played` may be used. The cost of a pair is the absolute difference between its two ratings.

Return the smallest possible sum of pair costs, or $-1$ if a complete pairing is impossible, including an odd number of players. For no players, return $0$. Return only the cost; the pairs themselves are not needed.
"""

description_ru = """
Игроки пронумерованы от $0$ до $n-1$, где $n$ — длина `ratings`. Рейтинг — целое число, характеризующее силу игрока. В `played` перечислены неупорядоченные пары уже встречавшихся игроков; индексы внутри пары могут идти в любом порядке.

Для последнего тура разбейте **всех** игроков на пары. Каждый должен попасть ровно в одну пару; использовать пары из `played` нельзя. Стоимость пары — абсолютная разность рейтингов двух игроков.

Верните минимальную возможную сумму стоимостей либо $-1$, если полная жеребьёвка невозможна, в том числе при нечётном числе игроков. Для пустого списка игроков верните $0$. Нужна только стоимость, сами пары возвращать не надо.
"""

description_es = """
Los jugadores están numerados de $0$ a $n-1$, donde $n$ es la longitud de `ratings`. Un rating es un entero que representa la fuerza del jugador. `played` enumera parejas no ordenadas de jugadores que ya se enfrentaron; los índices pueden aparecer en cualquier orden.

Para la última ronda, divide a **todos** los jugadores en parejas. Cada uno debe aparecer exactamente una vez y no se puede usar ninguna pareja de `played`. El coste de una pareja es la diferencia absoluta entre sus ratings.

Devuelve la mínima suma posible de costes, o $-1$ si el emparejamiento completo es imposible, incluido un número impar de jugadores. Sin jugadores, devuelve $0$. Devuelve solo el coste, no las parejas.
"""

description_zh = """
选手编号为 $0$ 到 $n-1$，其中 $n$ 是 `ratings` 的长度。等级分是表示实力的整数。`played` 列出已经交手的无序选手对；每对中的两个编号可以采用任意顺序。

在最后一轮中，将**所有**选手分成两人组。每人必须恰好出现一次，且不能使用 `played` 中的任何一对。每对的代价是两人等级分之差的绝对值。

返回最小代价总和；如果无法完成全部配对，返回 $-1$，选手人数为奇数时也如此。没有选手时返回 $0$。只需返回代价，不需要返回配对本身。
"""

limits = """
- $0 \\leq n=|ratings| \\leq 12$
- $1000 \\leq ratings_i \\leq 2800$
- $0 \\leq |played| \\leq \\min(24,n(n-1)/2)$
- $|played_i|=2$
- $0 \\leq played_{i,0},played_{i,1}<n$
- $played_{i,0}\\neq played_{i,1}$
- $i\\neq j\\implies\\{played_{i,0},played_{i,1}\\}\\neq\\{played_{j,0},played_{j,1}\\}$
"""

solution = """
def solution(ratings, played):
    from functools import lru_cache
    n = len(ratings)
    if n % 2:
        return -1
    blocked = {tuple(sorted(pair)) for pair in played}
    @lru_cache(None)
    def best(mask):
        if not mask:
            return 0
        bit = mask & -mask
        i, rest = bit.bit_length() - 1, mask ^ bit
        answer = float(\"inf\")
        for j in range(i + 1, n):
            if rest >> j & 1 and (i, j) not in blocked:
                cost = abs(ratings[i] - ratings[j])
                answer = min(answer, cost + best(rest ^ (1 << j)))
        return answer
    answer = best((1 << n) - 1)
    return -1 if answer == float(\"inf\") else answer
"""

examples = """
```python
solution([], []) == 0
solution([1500, 1600], []) == 100
solution([1500, 1600], [[0, 1]]) == -1
```
"""

