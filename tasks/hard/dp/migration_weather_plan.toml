base_score        = 200
level             = "hard"
name              = "migration_weather_plan"
tags              = ["dp", "collections"]
time_to_solve_sec = 700

description_en = """
Many birds postpone departure in bad weather and use a tail wind to save energy. The route is split into $S$ segments that must be flown in order, and `costs` holds one row per day with $S$ values in each row. On every day the bird either rests or flies the next segment it has not flown yet: flying segment $s$ on day $d$ costs `costs[d][s]` energy, while `costs[d][s]` $= -1$ means that this segment cannot be flown on that day.

Return the minimum total energy needed to fly all $S$ segments within the given days, or $-1$ when that is impossible.
"""

description_ru = """
Многие птицы откладывают вылет при плохой погоде и используют попутный ветер для экономии энергии. Маршрут разбит на $S$ участков, которые проходятся по порядку, а `costs` содержит по одной строке на каждый день и по $S$ значений в строке. Каждый день птица либо отдыхает, либо проходит следующий непройденный участок: прохождение участка $s$ в день $d$ стоит `costs[d][s]` энергии, а `costs[d][s]` $= -1$ означает, что этот участок в этот день пройти нельзя.

Верните минимальный суммарный расход энергии на прохождение всех $S$ участков за отведённые дни или $-1$, если это невозможно.
"""

limits = """
- $1 \\leq \\text{len}(\\text{costs}) \\leq 300$
- $1 \\leq \\text{len}(\\text{costs}[d]) = \\text{len}(\\text{costs}[0]) \\leq 300$
- $\\text{costs}[d][s] \\in \\{-1\\} \\cup [0, 10^4]$
"""

solution = """
def solution(costs: list[list[int]]) -> int:
    segments = len(costs[0])
    infinity = float("inf")
    dp = [0] + [infinity] * segments
    for day in costs:
        next_dp = dp[:]
        for segment, energy in enumerate(day):
            if energy >= 0:
                next_dp[segment + 1] = min(next_dp[segment + 1],
                                           dp[segment] + energy)
        dp = next_dp
    return -1 if dp[-1] == infinity else dp[-1]
"""

examples = """
solution([[-1]]) == -1
solution([[-1], [3]]) == 3
solution([[1, 5], [2, 1]]) == 2
"""

