base_score        = 210
level             = "hard"
name              = "windborne_seed_path"
tags              = ["graphs", "grid"]
time_to_solve_sec = 750

description_en = """
The direction of air currents shapes the trajectory of wind-dispersed seeds. Every cell of the rectangular grid `wind` holds the local wind direction: `U` up, `D` down, `L` left, `R` right, where up means towards row $0$ and left means towards column $0$; all rows have the same length. A seed starts in the top left cell and moves between cells sharing a side. A move out of a cell is free when it goes in the wind direction of that cell and costs $1$ otherwise.

Return the minimum total cost of a path to the bottom right cell.
"""

description_ru = """
Направление воздушных потоков определяет траекторию ветрораспространяемых семян. Каждая клетка прямоугольной сетки `wind` содержит местное направление ветра: `U` — вверх, `D` — вниз, `L` — влево, `R` — вправо, где вверх означает в сторону строки $0$, а влево — в сторону столбца $0$; все строки имеют одинаковую длину. Семя начинает движение в левой верхней клетке и перемещается между клетками, имеющими общую сторону. Переход из клетки бесплатен, если он совпадает с направлением ветра в этой клетке, и стоит $1$ в противном случае.

Верните минимальную суммарную стоимость пути в правую нижнюю клетку.
"""

limits = """
- $1 \\leq \\text{len}(\\text{wind}) \\leq 300$
- $1 \\leq \\text{len}(\\text{wind}[i]) = \\text{len}(\\text{wind}[0]) \\leq 300$
- $\\text{wind}[i][j] \\in \\{U, D, L, R\\}$
"""

solution = """
def solution(wind: list[str]) -> int:
    from collections import deque
    height, width = len(wind), len(wind[0])
    distance = [[float("inf")] * width for _ in range(height)]
    distance[0][0] = 0
    queue = deque([(0, 0)])
    directions = [(0, 1, "R"), (1, 0, "D"), (0, -1, "L"), (-1, 0, "U")]
    while queue:
        row, column = queue.popleft()
        for dr, dc, direction in directions:
            nr, nc = row + dr, column + dc
            if 0 <= nr < height and 0 <= nc < width:
                cost = wind[row][column] != direction
                new_distance = distance[row][column] + cost
                if new_distance < distance[nr][nc]:
                    distance[nr][nc] = new_distance
                    if cost:
                        queue.append((nr, nc))
                    else:
                        queue.appendleft((nr, nc))
    return distance[-1][-1]
"""

examples = """
solution(["U"]) == 0
solution(["RD", "LL"]) == 0
solution(["LL", "UU"]) == 2
"""

