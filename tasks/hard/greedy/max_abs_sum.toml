level             = "hard"
name              = "max_abs_sum"
tags              = ["greedy", "math"]
time_to_solve_sec = 390

description_ru = '''
В последовательности разрешается изменить знак у не более чем $K$ чисел.
Определите максимальный модуль суммы последовательности, который можно получить
с помощью этих операций.
'''

description_en = '''
In a sequence you are allowed to change the sign of at most $K$ numbers.
Determine the maximum possible absolute value of the sum of the sequence after
performing these operations.
'''

solution = """
def solution(k, arr):
    \"\"\"Return the maximal possible absolute value of the sum after changing
    signs of at most ``k`` elements.

    Parameters
    ----------
    k : int
        Maximum number of elements whose sign may be flipped.
    arr : list[int]
        The original sequence of integers.

    Returns
    -------
    int
        The maximal absolute sum obtainable with ≤ k sign changes.
    \"\"\"
    total = sum(arr)

    # Flipping a negative number makes the sum larger.
    # Take up to k negatives with the biggest absolute values.
    neg_abs = sorted((-x for x in arr if x < 0), reverse=True)
    add = sum(neg_abs[:k])
    max_sum = total + 2 * add

    # Flipping a positive number makes the sum smaller.
    # Take up to k positives with the biggest values.
    pos = sorted((x for x in arr if x > 0), reverse=True)
    sub = sum(pos[:k])
    min_sum = total - 2 * sub

    return max(abs(max_sum), abs(min_sum))
"""

examples = """
solution(1, [-1000]) == 1000
solution(1, [1, 2, -1, -3]) == 5
solution(2, [5, -3, 7, 9, -2, -8, -1]) == 29
"""

