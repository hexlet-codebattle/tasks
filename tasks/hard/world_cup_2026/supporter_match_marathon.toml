base_score        = 230
level             = "hard"
name              = "supporter_match_marathon"
tags              = ["world_cup_2026", "dynamic_programming"]
time_to_solve_sec = 700

description_en = """
Each match is `[start, end, city]`; match times are measured in minutes from the start of the tournament.
`travel[a][b]` is the non-negative travel time in minutes from city `a` to city `b`.
A supporter may begin at any match.
After attending match `i`, match `j` is reachable when `end_i + travel[city_i][city_j] <= start_j`; arrival exactly at kickoff is allowed.

Return a longest chronological list of original match indices that the supporter can attend fully.
For equal lengths, return the lexicographically smaller index list.
"""

description_ru = """
Каждый матч задан как `[start, end, city]`; время матчей измеряется в минутах от начала турнира.
`travel[a][b]` хранит неотрицательное время переезда в минутах из города `a` в город `b`.
Болельщик может начать маршрут с любого матча.
После матча `i` можно успеть на матч `j`, если `end_i + travel[city_i][city_j] <= start_j`; прибытие точно к началу разрешено.

Верните самый длинный хронологический список исходных индексов матчей, которые можно посетить полностью.
При равной длине выберите лексикографически меньший список индексов.
"""

limits = """
- $0 \\leq n \\leq 104$
- $1 \\leq c \\leq 16$
- $n = \\operatorname{len}(matches)$
- $\\operatorname{len}(matches_i) = 3$
- $0 \\leq start_i < end_i \\leq 60000$
- $0 \\leq city_i < c$
- $\\operatorname{len}(travel) = c$
- $\\operatorname{len}(travel_i) = c$
- $0 \\leq travel_{i,j} \\leq 3000$
"""

solution = """
def solution(matches: list[list[int]], travel: list[list[int]]) -> list[int]:
    order = sorted(range(len(matches)),
                   key=lambda i: (matches[i][0], matches[i][1], i))
    best_to = {}
    answer = ()
    for position, j in enumerate(order):
        best = (j,)
        for i in order[:position]:
            arrival = matches[i][1] + travel[matches[i][2]][matches[j][2]]
            if arrival <= matches[j][0]:
                candidate = best_to[i] + (j,)
                if len(candidate) > len(best) or (
                    len(candidate) == len(best) and candidate < best
                ):
                    best = candidate
        best_to[j] = best
        if len(best) > len(answer) or (
            len(best) == len(answer) and best < answer
        ):
            answer = best
    return list(answer)
"""

examples = """
solution([], [[0]]) == []
solution([[0, 10, 0]], [[0]]) == [0]
solution([[0, 10, 0], [10, 20, 0]], [[0]]) == [0, 1]
"""

