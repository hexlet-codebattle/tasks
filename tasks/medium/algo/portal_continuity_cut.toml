base_score        = 135
level             = "medium"
name              = "portal_continuity_cut"
tags              = ["algo", "two_pointers", "spider_man"]
time_to_solve_sec = 400

description_en = """
The trailer timeline is `scene_ids`. Repeated IDs create a continuity error. The editor may delete one contiguous half-open segment, possibly empty, and join the remaining prefix and suffix.

Return the minimum number of deleted elements needed so that every ID in the remaining timeline is distinct. Deleting the whole timeline is allowed.
"""

description_ru = """
Монтажная последовательность трейлера задана массивом `scene_ids`. Повторяющиеся идентификаторы создают ошибку непрерывности. Монтажер может удалить один непрерывный полуинтервал, в том числе пустой, и соединить оставшиеся префикс и суффикс.

Верните минимальное количество удаленных элементов, после которого все идентификаторы в оставшейся последовательности различны. Разрешено удалить всю последовательность.
"""

limits = """
- $0 \\leq \\text{len}(\\text{scene\\_ids}) \\leq 10^5$
- $-10^9 \\leq \\text{scene\\_ids}[i] \\leq 10^9$
"""

solution = """
def solution(scene_ids: list[int]) -> int:
    right, suffix = len(scene_ids), set()
    while right and scene_ids[right - 1] not in suffix:
        right -= 1; suffix.add(scene_ids[right])
    answer, prefix = right, set()
    for left, scene in enumerate(scene_ids):
        if scene in prefix: break
        prefix.add(scene)
        while scene in suffix:
            suffix.remove(scene_ids[right]); right += 1
        answer = min(answer, right - left - 1)
    return answer
"""

examples = """
solution([]) == 0
solution([1, 2, 1]) == 1
solution([1, 2, 1, 2]) == 2
"""

