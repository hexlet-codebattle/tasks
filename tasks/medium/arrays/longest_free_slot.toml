base_score        = 150
level             = "medium"
name              = "longest_free_slot"
tags              = ["arrays", "sorting", "university"]
time_to_solve_sec = 300

description_en = """
A student's study day spans the minutes from $0$ to `day_minutes`. The array `busy` lists `[start, end]` intervals (possibly overlapping, possibly unsorted) when she is occupied with classes, labs, or meetings.

A free slot is any maximal stretch of minutes inside $[0, \\text{day\\_minutes}]$ that is not covered by any busy interval.

Return the length of the longest such free slot, or $0$ if no free time remains.
"""

description_ru = """
Учебный день студентки длится от минуты $0$ до `day_minutes`. Массив `busy` содержит интервалы `[start, end]` (возможно пересекающиеся и неотсортированные), когда она занята занятиями, лабораторными или встречами.

Свободный промежуток — это максимальная непрерывная полоса минут внутри $[0, \\text{day\\_minutes}]$, не покрытая ни одним интервалом из `busy`.

Верните длину самого длинного такого свободного промежутка или $0$, если свободного времени не осталось.
"""

limits = """
- $0 \\leq \\text{len}(\\text{busy}) \\leq 10^4$
- $0 \\leq \\text{start} < \\text{end} \\leq \\text{day\\_minutes} \\leq 1440$
"""

solution = """
def solution(busy: list, day_minutes: int) -> int:
    if not busy:
        return day_minutes
    iv = sorted(busy)
    free = iv[0][0]
    end = iv[0][1]
    for s, e in iv[1:]:
        if s > end:
            free = max(free, s - end)
            end = e
        else:
            end = max(end, e)
    return max(free, day_minutes - end)
"""

examples = """
solution([], 480) == 480
solution([[0, 480]], 480) == 0
solution([[60, 120]], 480) == 360
solution([[0, 60], [120, 180]], 240) == 60
solution([[0, 100], [50, 150]], 300) == 150
"""

