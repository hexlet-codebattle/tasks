level             = "medium"
name              = "schedule_conflicts"
tags              = ["arrays", "university"]
time_to_solve_sec = 300

description_en = """
A student picks several lectures for the term. Each lecture is given as a pair `[start, end]` (in minutes from the day's start) inside the array `lectures`, where `end` is exclusive.

Two lectures conflict if their intervals overlap (share at least one minute). Lectures that merely touch at an endpoint do not conflict.

Return the number of unordered pairs of conflicting lectures.
"""

description_ru = """
Студент выбирает несколько лекций на семестр. Каждая лекция задана парой `[start, end]` (в минутах от начала суток) в массиве `lectures`, причём `end` не включается.

Две лекции конфликтуют, если их интервалы пересекаются (имеют хотя бы одну общую минуту). Лекции, соприкасающиеся только в граничной точке, не конфликтуют.

Верните число неупорядоченных пар конфликтующих лекций.
"""

limits = """
- $0 \\leq \\text{len}(\\text{lectures}) \\leq 10^3$
- $0 \\leq \\text{start} < \\text{end} \\leq 1440$
"""

solution = """
def solution(lectures: list) -> int:
    n = len(lectures)
    c = 0
    for i in range(n):
        for j in range(i + 1, n):
            a, b = lectures[i], lectures[j]
            if a[0] < b[1] and b[0] < a[1]:
                c += 1
    return c
"""

examples = """
solution([]) == 0
solution([[0, 60]]) == 0
solution([[0, 60], [30, 90]]) == 1
solution([[0, 60], [60, 120]]) == 0
solution([[0, 100], [10, 20], [50, 60]]) == 2
"""

