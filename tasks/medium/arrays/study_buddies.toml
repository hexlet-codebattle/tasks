base_score        = 150
level             = "medium"
name              = "study_buddies"
tags              = ["arrays", "hash_maps", "university"]
time_to_solve_sec = 300

description_en = """
At the start of the term, the dean's office collects each student's course enrollment. `courses[i]` is the list of course codes that student `i` is enrolled in.

Two students are study buddies if they share at least one common course code. The student union wants to know how many such pairs exist on campus.

Return the number of unordered study-buddy pairs.
"""

description_ru = """
В начале семестра деканат собирает список курсов каждого студента. `courses[i]` — массив кодов курсов, на которые записан студент `i`.

Два студента — напарники по учёбе, если у них есть хотя бы один общий код курса. Студенческий союз хочет узнать, сколько таких пар на кампусе.

Верните число неупорядоченных пар напарников.
"""

limits = """
- $0 \\leq \\text{len}(\\text{courses}) \\leq 500$
- $0 \\leq \\text{len}(\\text{courses}[i]) \\leq 50$
"""

solution = """
def solution(courses: list) -> int:
    sets = [set(c) for c in courses]
    c = 0
    for i in range(len(sets)):
        for j in range(i + 1, len(sets)):
            if sets[i] & sets[j]:
                c += 1
    return c
"""

examples = """
solution([]) == 0
solution([["cs101"]]) == 0
solution([["cs101"], ["cs101"]]) == 1
solution([["cs101"], ["ma101"]]) == 0
solution([["cs101", "ma101"], ["cs101"], ["ph101"]]) == 1
"""

