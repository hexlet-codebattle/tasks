description_en = """
Vasya studies $n$ subjects. For each subject he has a current grade, and grades are not bounded from above.
His performance is defined as the lowest grade among all subjects.
In one hour Vasya can increase the grade of any one subject by $1$.
Given $k$ hours, determine the maximum possible performance Vasya can achieve after spending at most $k$ hours.
"""

description_ru = """
Вася изучает $n$ предметов. По каждому предмету у Васи есть текущая оценка, и оценки не ограничены сверху.
Успеваемость - это самая низкая оценка среди всех предметов.
За один час Вася может увеличить на $1$ оценку по одному из предметов.
По заданному количеству часов $k$ определите максимальную успеваемость, которую Вася может достичь, потратив не более $k$ часов.
"""

solution = """
def solution(n, k, grades):
    # Find the maximal possible minimum grade after at most k increments.
    lo = min(grades)
    hi = lo + k + 1  # exclusive upper bound

    while lo < hi:
        mid = (lo + hi) // 2
        needed = 0
        for g in grades:
            if g < mid:
                needed += mid - g
                if needed > k:
                    break
        if needed <= k:
            lo = mid + 1
        else:
            hi = mid
    return lo - 1
"""

examples = """
solution(3, 3, [2, 3, 4]) == 4
solution(4, 6, [101, 102, 101, 101]) == 102
"""

