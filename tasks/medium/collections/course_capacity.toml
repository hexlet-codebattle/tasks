level             = "medium"
name              = "course_capacity"
tags              = ["collections", "university"]
time_to_solve_sec = 360

description_en = """
A popular course at the university has `capacity` seats. The registration system processes the array `events` in order, with each event written as one of the strings below:

- `"add:NAME"` requests enrollment for student `NAME`.
- `"drop:NAME"` cancels `NAME`'s enrollment or waitlist spot.

On enrollment a student takes a free seat, or joins the waitlist (first-in, first-out) when the course is full. When an enrolled student drops, the earliest waitlisted student takes the freed seat. Adding a student who is already enrolled or already waitlisted is ignored.

Return the sorted list of names of students currently enrolled in the course.
"""

description_ru = """
На популярном университетском курсе `capacity` мест. Система регистрации обрабатывает массив `events` по порядку; каждое событие записано одной из строк:

- `"add:NAME"` — запрос на запись студента `NAME`.
- `"drop:NAME"` — отмена записи или места в очереди для `NAME`.

При записи студент занимает свободное место либо встаёт в очередь (FIFO), если курс заполнен. Когда записанный студент уходит, освободившееся место занимает самый ранний из очереди. Повторная запись уже записанного или уже стоящего в очереди студента игнорируется.

Верните отсортированный список имён студентов, записанных на курс в данный момент.
"""

limits = """
- $0 \\leq \\text{capacity} \\leq 10^3$
- $0 \\leq \\text{len}(\\text{events}) \\leq 10^4$
"""

solution = """
def solution(capacity: int, events: list) -> list:
    enrolled = []
    wait = []
    for e in events:
        act, name = e.split(":", 1)
        if act == "add":
            if name in enrolled or name in wait:
                continue
            if len(enrolled) < capacity:
                enrolled.append(name)
            else:
                wait.append(name)
        else:
            if name in enrolled:
                enrolled.remove(name)
                if wait:
                    enrolled.append(wait.pop(0))
            elif name in wait:
                wait.remove(name)
    return sorted(enrolled)
"""

examples = """
solution(1, []) == []
solution(2, ["add:alice"]) == ["alice"]
solution(1, ["add:alice", "add:bob"]) == ["alice"]
solution(1, ["add:alice", "drop:alice", "add:bob"]) == ["bob"]
solution(2, ["add:alice", "add:bob", "drop:alice"]) == ["bob"]
"""

