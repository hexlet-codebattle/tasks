base_score        = 150
level             = "medium"
name              = "honor_roll"
tags              = ["collections", "university"]
time_to_solve_sec = 300

description_en = """
The dean's office is preparing the semester's honor roll. The array `students` lists every student's name, and `gpas[i]` is the GPA of student `students[i]`. A GPA of $-1.0$ marks a student who has not received any grades yet and must be excluded.

A student makes the honor roll if her GPA is at least `threshold`.

Return the honor-roll names sorted by GPA in descending order, breaking ties by name in ascending lexicographic order.
"""

description_ru = """
Деканат составляет список отличников за семестр. Массив `students` содержит имена студентов, а `gpas[i]` — средний балл студента `students[i]`. Значение $-1.0$ означает, что студент ещё не получил ни одной оценки, и его нужно исключить.

Студент попадает в список, если его средний балл не ниже `threshold`.

Верните имена отличников, отсортированные по среднему баллу по убыванию, а при равенстве — по имени по возрастанию (лексикографически).
"""

limits = """
- $0 \\leq \\text{len}(\\text{students}) \\leq 10^3$
- $\\text{len}(\\text{students}) = \\text{len}(\\text{gpas})$
- $-1.0 \\leq \\text{gpas}[i] \\leq 4.0$
- $0.0 \\leq \\text{threshold} \\leq 4.0$
"""

solution = """
def solution(students: list, gpas: list, threshold: float) -> list:
    q = [(g, n) for n, g in zip(students, gpas) if g >= 0 and g >= threshold]
    q.sort(key=lambda x: (-x[0], x[1]))
    return [n for _, n in q]
"""

examples = """
solution([], [], 3.5) == []
solution(["amy"], [2.0], 3.5) == []
solution(["amy"], [4.0], 3.5) == ["amy"]
solution(["amy", "bob"], [4.0, 3.0], 3.5) == ["amy"]
solution(["amy", "bob"], [3.5, 3.5], 3.5) == ["amy", "bob"]
"""

