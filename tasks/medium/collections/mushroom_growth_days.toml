base_score        = 100
level             = "medium"
name              = "mushroom_growth_days"
tags              = ["collections", "prefix_scan"]
time_to_solve_sec = 330

description_en = """
A visible mushroom is a fruiting body, while the main part of the organism lives in the soil as mycelium, and many species need enough moisture to fruit. In this model a fruiting body appears on day $i$ when the total rainfall over the `window` days ending at day $i$ inclusive is at least `min_rain`. Days with fewer than `window` days behind them never count.

Return the indices of all such days in increasing order, or an empty array when there are none.
"""

description_ru = """
Видимый гриб — это плодовое тело, а основная часть организма живёт в почве как мицелий, и многим видам для плодоношения нужна достаточная влажность. В этой модели плодовое тело появляется в день $i$, если сумма осадков за `window` дней, заканчивающихся днём $i$ включительно, не меньше `min_rain`. Дни, перед которыми нет полного окна, не учитываются.

Верните индексы всех таких дней в порядке возрастания или пустой массив, если их нет.
"""

description_es = """
Un hongo visible es un cuerpo fructífero, mientras que la parte principal del organismo vive en el suelo como micelio y muchas especies necesitan suficiente humedad para dar fruto. En este modelo, un cuerpo fructífero aparece el día $i$ cuando la precipitación total durante los días `window` que terminan en el día $i$ inclusive es al menos `min_rain`. Los días con menos de `window` días detrás nunca cuentan.

Devuelve los índices de todos esos días en orden creciente, o una matriz vacía cuando no hay ninguno.
"""

description_zh = """
可见的蘑菇是子实体，而生物体的主要部分以菌丝体的形式生活在土壤中，许多物种需要足够的水分才能结果。在此模型中，当 $i$ 日结束的 `window` 天内的总降雨量至少为 `min_rain` 时，子实体会在 $i$ 日出现。后面少于 `window` 天的天数不计算在内。

按升序返回所有此类日期的索引，如果没有则返回空数组。
"""

limits = """
- $1 \\leq \\text{len}(\\text{rain}) \\leq 10^5$
- $0 \\leq \\text{rain}[i] \\leq 100$
- $1 \\leq \\text{window} \\leq 10^5$
- $0 \\leq \\text{min\\_rain} \\leq 10^7$
"""

solution = """
def solution(rain: list[int], window: int, min_rain: int) -> list[int]:
    prefix = [0]
    for amount in rain:
        prefix.append(prefix[-1] + amount)
    return [i for i in range(window - 1, len(rain))
            if prefix[i + 1] - prefix[i + 1 - window] >= min_rain]
"""

examples = """
solution([6], 1, 7) == []
solution([1, 1, 1], 2, 5) == []
solution([2, 3, 1, 4], 2, 5) == [1, 3]
"""

