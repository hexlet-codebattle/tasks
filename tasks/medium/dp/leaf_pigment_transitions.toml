base_score        = 110
level             = "medium"
name              = "leaf_pigment_transitions"
tags              = ["dp", "collections"]
time_to_solve_sec = 360

description_en = """
In autumn chlorophyll breaks down, carotenoids become visible, and many species also build up red anthocyanins. Observations are listed in chronological order, and `pigments[i]` holds the amounts of green, yellow and red pigment of observation $i$. In every observation one of the three amounts is strictly greater than the other two, and that pigment is the dominant one. Dominant pigments are ordered green $<$ yellow $<$ red.

Remove as few observations as possible so that in the remaining ones, read in order, the dominant pigment never moves back in that order. Return the number of removed observations.
"""

description_ru = """
Осенью хлорофилл разрушается, становятся заметны каротиноиды, а у многих видов накапливаются красные антоцианы. Наблюдения перечислены в хронологическом порядке, а `pigments[i]` содержит количества зелёного, жёлтого и красного пигментов в наблюдении $i$. В каждом наблюдении одно из трёх количеств строго больше двух других — это преобладающий пигмент. Преобладающие пигменты упорядочены как зелёный $<$ жёлтый $<$ красный.

Удалите минимум наблюдений так, чтобы в оставшихся, прочитанных по порядку, преобладающий пигмент ни разу не возвращался назад в этом порядке. Верните количество удалённых наблюдений.
"""

limits = """
- $0 \\leq \\text{len}(\\text{pigments}) \\leq 10^3$
- $\\text{len}(\\text{pigments}[i]) = 3$
- $0 \\leq \\text{pigments}[i][j] \\leq 10^6$
"""

solution = """
def solution(pigments: list[list[int]]) -> int:
    states = [max(range(3), key=amounts.__getitem__) for amounts in pigments]
    best = [0, 0, 0]
    for state in states:
        best[state] = 1 + max(best[:state + 1])
    return len(states) - max(best)
"""

examples = """
solution([]) == 0
solution([[5, 2, 1], [2, 5, 1], [1, 2, 5]]) == 0
solution([[1, 2, 5], [5, 2, 1], [1, 5, 2]]) == 1
"""

