base_score        = 145
level             = "medium"
name              = "web_anchor_combo"
tags              = ["dp", "spider_man"]
time_to_solve_sec = 430

description_en = """
Rooftop anchors have strictly increasing positive positions `positions`; landing on anchor $i$ adds `bonuses[i]` to Spider-Man's combo score. He starts at position $0$ and may only move right. Every jump distance must be between `min_jump` and `max_jump`, inclusive. Anchors may be skipped, and he may stop after any landing.

Return the maximum possible total bonus. Spider-Man may make no jump, which scores $0$. A route may pass through negative-bonus anchors when that unlocks a better later landing.
"""

description_ru = """
Крепления на крышах имеют строго возрастающие положительные координаты `positions`; приземление на крепление $i$ добавляет `bonuses[i]` к счету комбо. Человек-паук начинает в точке $0$ и может двигаться только вправо. Длина каждого прыжка должна находиться между `min_jump` и `max_jump` включительно. Крепления можно пропускать, а остановиться можно после любого приземления.

Верните максимальную сумму бонусов. Можно не делать ни одного прыжка и получить $0$. Маршрут может проходить через крепления с отрицательным бонусом, если это открывает более выгодное приземление дальше.
"""

limits = """
- $1 \\leq \\text{len}(\\text{positions}) = \\text{len}(\\text{bonuses}) \\leq 500$
- $1 \\leq \\text{positions}[i] < \\text{positions}[i+1] \\leq 10^6$
- $-10^6 \\leq \\text{bonuses}[i] \\leq 10^6$
- $1 \\leq \\text{min\\_jump} \\leq \\text{max\\_jump} \\leq 10^6$
"""

solution = """
def solution(positions: list[int], bonuses: list[int], min_jump: int, max_jump: int) -> int:
    scores, answer = [None] * len(positions), 0
    for i, position in enumerate(positions):
        best = 0 if min_jump <= position <= max_jump else None
        for j in range(i):
            if scores[j] is not None and min_jump <= position - positions[j] <= max_jump:
                best = scores[j] if best is None else max(best, scores[j])
        if best is not None:
            scores[i] = best + bonuses[i]
            answer = max(answer, scores[i])
    return answer
"""

examples = """
solution([2], [5], 1, 3) == 5
solution([5], [10], 1, 3) == 0
solution([2, 5], [4, 7], 2, 3) == 11
"""

