description_en = """
During a stopover birds rest and rebuild their energy reserves, so the loss of key sites can break a long route. Every element of `points` is a location `[x, y]` on a plane: the first point is where the flight starts, the last one is its destination, and the other points are possible stopover sites. One flight leads from any point to any point whose Euclidean distance is at most `max_distance`.

Return the smallest possible number of stopover sites used on the way from the first point to the last one, or $-1$ when no route exists.
"""

description_ru = """
Во время миграционной остановки птицы отдыхают и восстанавливают запасы энергии, поэтому потеря ключевых мест может разорвать длинный маршрут. Каждый элемент массива `points` — это точка `[x, y]` на плоскости: первая точка — начало перелёта, последняя — его цель, остальные — возможные места остановки. Один перелёт ведёт из любой точки в любую другую, если евклидово расстояние между ними не больше `max_distance`.

Верните минимальное количество мест остановки на пути от первой точки к последней или $-1$, если маршрута нет.
"""

description_es = """
Durante las escalas, las aves descansan y recuperan energía, por lo que perder lugares clave puede interrumpir una ruta larga. Cada elemento de `points` es una posición `[x, y]` en un plano: el primero es el origen, el último es el destino y los demás son posibles escalas. Un vuelo puede unir dos puntos si su distancia euclidiana es como máximo `max_distance`.

Devuelve el mínimo número de escalas entre el primer punto y el último, o $-1$ si no existe ninguna ruta.
"""

description_zh = """
鸟类在中途停歇时休息并恢复能量，因此失去关键停歇地可能使迁徙路线中断。`points` 的每项都是平面上的位置 `[x, y]`：第一个点为起点，最后一个点为终点，其余为可选停歇地。两点的欧氏距离不超过 `max_distance` 时，可以直接飞行。

返回从第一个点到最后一个点所需的最少中途停歇次数；若不存在路线，则返回 $-1$。
"""

limits = """
- $2 \\leq \\text{len}(\\text{points}) \\leq 500$
- $\\text{len}(\\text{points}[i]) = 2$
- $-10^4 \\leq \\text{points}[i][j] \\leq 10^4$
- $0 \\leq \\text{max\\_distance} \\leq 10^4$
"""

solution = """
def solution(points: list[list[int]], max_distance: int) -> int:
    queue = [(0, 0)]
    seen = {0}
    for point, flights in queue:
        if point == len(points) - 1:
            return flights - 1
        for other in range(len(points)):
            distance = ((points[point][0] - points[other][0]) ** 2 +
                        (points[point][1] - points[other][1]) ** 2)
            if other not in seen and distance <= max_distance ** 2:
                seen.add(other)
                queue.append((other, flights + 1))
    return -1
"""

examples = """
solution([[0, 0], [3, 0]], 3) == 0
solution([[0, 0], [5, 0]], 3) == -1
solution([[0, 0], [3, 0], [6, 0]], 3) == 1
"""

