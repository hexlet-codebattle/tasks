level             = "medium"
name              = "min_lecture_rooms"
tags              = ["greedy", "sorting", "university"]
time_to_solve_sec = 300

description_en = """
The timetabling office must assign rooms for the term's lectures. Each lecture is given as a pair `[start, end]` (in minutes from the day's start) inside the array `lectures`, where `end` is exclusive.

Two lectures may share a room only if their intervals do not overlap. Lectures that merely touch at an endpoint (one ends exactly when another begins) may share a room.

Return the minimum number of rooms needed so that every lecture has a room.
"""

description_ru = """
Отдел расписания должен распределить аудитории под лекции семестра. Каждая лекция задана парой `[start, end]` (в минутах от начала суток) в массиве `lectures`, причём `end` не включается.

Две лекции могут занимать одну аудиторию, только если их интервалы не пересекаются. Лекции, соприкасающиеся лишь в граничной точке (одна заканчивается ровно тогда, когда начинается другая), могут делить аудиторию.

Верните минимальное число аудиторий, необходимое, чтобы каждой лекции хватило места.
"""

limits = """
- $0 \\leq \\text{len}(\\text{lectures}) \\leq 10^4$
- $0 \\leq \\text{start} < \\text{end} \\leq 1440$
"""

solution = """
def solution(lectures: list) -> int:
    if not lectures:
        return 0
    starts = sorted(s for s, e in lectures)
    ends = sorted(e for s, e in lectures)
    n = len(lectures)
    rooms = 0
    best = 0
    i = j = 0
    while i < n:
        if starts[i] < ends[j]:
            rooms += 1
            best = max(best, rooms)
            i += 1
        else:
            rooms -= 1
            j += 1
    return best
"""

examples = """
solution([]) == 0
solution([[0, 60]]) == 1
solution([[0, 60], [60, 120]]) == 1
solution([[0, 60], [30, 90]]) == 2
solution([[0, 200], [10, 190], [20, 180]]) == 3
"""

