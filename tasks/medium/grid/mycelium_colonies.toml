base_score        = 115
level             = "medium"
name              = "mycelium_colonies"
tags              = ["grid", "graphs"]
time_to_solve_sec = 380

description_en = """
Mycelium is a network of branching threads called hyphae, and it can live in the soil for years without producing visible fruiting bodies. On the rectangular map `forest` the character `M` marks a cell with mycelium and `.` marks an empty cell; all rows have the same length.

Two mycelium cells belong to the same colony when they share a side or only a corner, and this relation carries over along chains of cells. Return the number of colonies.
"""

description_ru = """
Мицелий — это сеть ветвящихся нитей, называемых гифами; он может годами жить в почве, не образуя видимых плодовых тел. На прямоугольной карте `forest` символ `M` обозначает клетку с мицелием, а `.` — пустую клетку; все строки имеют одинаковую длину.

Две клетки мицелия принадлежат одной колонии, если они соприкасаются стороной или только углом, и это отношение распространяется по цепочкам клеток. Верните количество колоний.
"""

limits = """
- $1 \\leq \\text{len}(\\text{forest}) \\leq 200$
- $1 \\leq \\text{len}(\\text{forest}[i]) = \\text{len}(\\text{forest}[0]) \\leq 200$
- $\\text{forest}[i][j] \\in \\{M, .\\}$
"""

solution = """
def solution(forest: list[str]) -> int:
    cells = {(r, c) for r, row in enumerate(forest) for c, x in enumerate(row) if x == "M"}
    colonies = 0
    while cells:
        colonies += 1
        stack = [cells.pop()]
        while stack:
            r, c = stack.pop()
            near = {(r + dr, c + dc) for dr in (-1, 0, 1) for dc in (-1, 0, 1)
                    if (dr or dc) and (r + dr, c + dc) in cells}
            cells -= near
            stack += near
    return colonies
"""

examples = """
solution(["M"]) == 1
solution(["M.M"]) == 2
solution(["MM.", "..M"]) == 1
"""

