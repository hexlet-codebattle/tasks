base_score        = 120
level             = "medium"
name              = "peak_leaf_abscission"
tags              = ["intervals", "sorting"]
time_to_solve_sec = 400

description_en = """
Before leaf fall an abscission zone forms at the base of the leaf stalk, and once the connection weakens wind and rain help the leaf to separate. For every tree `intervals` holds the days of its leaf fall as `[start, end]`, with both days included.

Return `[day, count]`, where `count` is the largest number of trees shedding leaves on the same day and `day` is the earliest day on which that number is reached. Return `[-1, 0]` when there are no trees.
"""

description_ru = """
Перед листопадом у основания черешка формируется зона абсциссии, и когда связь ослабевает, ветер и дождь помогают листу отделиться. Для каждого дерева массив `intervals` задаёт дни листопада как `[start, end]`, включая обе границы.

Верните `[day, count]`, где `count` — наибольшее количество деревьев, сбрасывающих листья в один и тот же день, а `day` — самый ранний день, в который достигается это количество. Если деревьев нет, верните `[-1, 0]`.
"""

limits = """
- $0 \\leq \\text{len}(\\text{intervals}) \\leq 10^5$
- $\\text{len}(\\text{intervals}[i]) = 2$
- $1 \\leq \\text{intervals}[i][0] \\leq \\text{intervals}[i][1] \\leq 10^6$
"""

solution = """
def solution(intervals: list[list[int]]) -> list[int]:
    if not intervals:
        return [-1, 0]
    events = {}
    for start, end in intervals:
        events[start] = events.get(start, 0) + 1
        events[end + 1] = events.get(end + 1, 0) - 1
    active = best = 0
    best_day = -1
    for day in sorted(events):
        active += events[day]
        if active > best:
            best_day, best = day, active
    return [best_day, best]
"""

examples = """
solution([]) == [-1, 0]
solution([[1, 1000000]]) == [1, 1]
solution([[1, 3], [2, 4], [4, 5]]) == [2, 2]
"""

