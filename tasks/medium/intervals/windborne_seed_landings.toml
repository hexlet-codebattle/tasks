base_score        = 120
level             = "medium"
name              = "windborne_seed_landings"
tags              = ["intervals", "sorting", "search"]
time_to_solve_sec = 400

description_en = """
Seed dispersal by wind is called anemochory: winged seeds and seeds with a pappus travel away from the parent plant, but they sprout only in suitable places. Every seed of `seeds` is carried by the same gust, so a seed at position `p` lands at `p + wind`. A landing succeeds when it falls inside at least one fertile interval `[left, right]`, both ends included. The intervals of `fertile` may overlap.

Return how many seeds land on fertile ground. Seeds that share a position are counted separately.
"""

description_ru = """
Распространение семян ветром называется анемохорией: крылатки и семена с хохолком уносятся от материнского растения, но прорастают только в подходящих местах. Все семена массива `seeds` уносит один порыв, поэтому семя из позиции `p` приземляется в точке `p + wind`. Приземление удачно, если точка попадает хотя бы в один плодородный интервал `[left, right]` с включёнными границами. Интервалы массива `fertile` могут пересекаться.

Верните количество семян, попавших на плодородную землю. Семена в одинаковых позициях считаются отдельно.
"""

limits = """
- $0 \\leq \\text{len}(\\text{seeds}) \\leq 10^5$
- $-10^6 \\leq \\text{seeds}[i] \\leq 10^6$
- $-10^6 \\leq \\text{wind} \\leq 10^6$
- $0 \\leq \\text{len}(\\text{fertile}) \\leq 10^5$
- $\\text{len}(\\text{fertile}[i]) = 2$
- $-10^6 \\leq \\text{fertile}[i][0] \\leq \\text{fertile}[i][1] \\leq 10^6$
"""

solution = """
def solution(seeds: list[int], wind: int, fertile: list[list[int]]) -> int:
    from bisect import bisect_right
    intervals = []
    for left, right in sorted(fertile):
        if intervals and left <= intervals[-1][1]:
            intervals[-1][1] = max(intervals[-1][1], right)
        else:
            intervals.append([left, right])
    starts = [left for left, _ in intervals]
    count = 0
    for seed in seeds:
        i = bisect_right(starts, seed + wind) - 1
        count += i >= 0 and seed + wind <= intervals[i][1]
    return count
"""

examples = """
solution([], 3, [[0, 10]]) == 0
solution([1, 2], 10, [[0, 5]]) == 0
solution([0, 5, 10], 2, [[1, 3], [7, 9]]) == 2
"""

