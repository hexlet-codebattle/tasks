base_score = 150
# ------------------- Problem metadata -------------------
level             = "medium"
name              = "max_problems"
tags              = ["math", "greedy", "strings"]
time_to_solve_sec = 300

# ------------------- Statements -------------------
description_ru = """
Во время раунда участнику каждую минуту записывали ЭЭГ в виде строки. Символ «A» означает, что в эту минуту он думал о задаче, любой другой символ — о чём‑то другом. Известно, что над каждой задачей участник размышлял различное количество минут. Определите максимально возможное количество задач в раунде.
В примере aAAaAbcdAAtrataAtoAApA участник думал над задачами 9 минут (количество букв A), это могло быть три задачи со временем размышления 1, 3 и 5 минут (возможны и другие распределения времени на конкретные задачи).
"""

description_en = """
During the round, the participant’s EEG was recorded every minute as a string. The character ‘A’ indicates that at that minute he was thinking about a problem, while any other character means he was thinking about something else. It is known that the participant thought about each problem for a different number of minutes. Determine the maximum possible number of problems in the round.
In the example of aAAaAbcdAAtrataAtoAApA, the participant thought about the tasks for 9 minutes (the number of letters A), it could be three tasks with a reflection time of 1, 3 and 5 minutes (other time distributions for specific tasks are possible).
"""

# ------------------- Reference solution -------------------
solution = """
def solution(eeg: str) -> int:
    \"\"\"
    The only thing that matters is the total count of the character 'A'.
    We need the largest k such that 1 + 2 + … + k ≤ N, where N = number of 'A's.
    The answer is floor((sqrt(1 + 8·N) - 1) / 2).
    \"\"\"
    from math import isqrt

    n = eeg.count('A')
    return (isqrt(1 + 8 * n) - 1) // 2
"""

examples = """
solution("aAAaAbcdAAtrataAtoAApA") == 3
solution("A") == 1
solution("rockArollAA") == 2
"""

