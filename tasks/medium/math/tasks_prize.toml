description_en = """
Given the number of a solved task, compute the minimal possible prize for that task.
The prize for the first task is 100 rubles. For each subsequent task the prize must be at least twice the previous one.
Additionally, a prize must be “round enough”: the count of trailing zeros in its decimal representation must be at least half of the total number of digits.
Return the smallest prize that satisfies all conditions for the given task number.
"""

description_ru = """
По известному номеру задачи определите минимальный возможный размер приза.
Приз за первую задачу — 100 рублей. Приз за каждую следующую задачу должен быть как минимум вдвое больше предыдущего.
Кроме того, приз должен быть «достаточно круглым»: количество нулей в конце числа должно быть не меньше половины количества всех его цифр.
Верните минимальный возможный приз для задачи с заданным номером.
"""

description_es = """
Dado el número de tareas resueltas, calcule el premio mínimo posible por esa tarea.
El premio por la primera tarea es de 100 rublos. Para cada tarea posterior el premio deberá ser al menos el doble del anterior.
Además, un premio debe ser “suficientemente redondo”: el número de ceros finales en su representación decimal debe ser al menos la mitad del número total de dígitos.
Devuelve el premio más pequeño que cumpla todas las condiciones para el número de tarea dado.
"""

description_zh = """
给定已解决任务的数量，计算该任务的最小可能奖励。
第一个任务的奖金是100卢布。对于每个后续任务，奖励必须至少是前一个任务的两倍。
此外，奖品必须“足够四舍五入”：十进制表示形式中尾随零的数量必须至少是总位数的一半。
返回满足给定任务编号的所有条件的最小奖励。
"""

solution = """
def solution(task_number: int) -> int:
    \"\"\"Return the minimal possible prize for the given task number.\"\"\"

    if task_number < 1:
        raise ValueError("task_number must be a positive integer")

    # prize for the first task
    prize = 100

    # helper: smallest number >= x with enough trailing zeros
    def _next_valid(x: int) -> int:
        # we need a number y = k * 10**z, k % 10 != 0, len(str(k)) <= z
        # and y >= x. Brute‑force over possible z.
        s = str(x)
        max_z = len(s) + 5          # safe upper bound for the search
        best = None
        for z in range(1, max_z + 1):
            base = 10 ** z
            k = (x + base - 1) // base   # ceil division
            # make k not end with zero (otherwise trailing zeros would be larger)
            if k % 10 == 0:
                k += 1
            if len(str(k)) <= z:
                candidate = k * base
                if best is None or candidate < best:
                    best = candidate
                    if candidate == x:
                        return candidate
        return best

    for _ in range(2, task_number + 1):
        prize = _next_valid(prize * 2)

    return prize
"""

examples = """
solution(1) == 100
solution(2) == 200
solution(8) == 13000
"""

