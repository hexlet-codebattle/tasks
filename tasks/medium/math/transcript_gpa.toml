description_en = """
The registrar is computing a student's grade point average for the transcript. The array `grades` lists the letter grade earned in each course, and `credits[i]` is the credit weight of course `i`.

Letter grades map to grade points as follows: `A` = 4.0, `A-` = 3.7, `B+` = 3.3, `B` = 3.0, `B-` = 2.7, `C+` = 2.3, `C` = 2.0, `C-` = 1.7, `D+` = 1.3, `D` = 1.0, `D-` = 0.7, `F` = 0.0. The grades `"P"` (pass) and `"NP"` (no pass) are taken pass/fail and are excluded from the GPA entirely, contributing neither grade points nor credits.

The GPA is the credit-weighted average of the grade points across all graded courses: divide the sum of `points * credits` by the sum of the counted credits.

Return the GPA rounded to two decimal places, or $0.0$ if there are no graded credits.
"""

description_ru = """
Учебный отдел вычисляет средний балл студента для зачётной книжки. Массив `grades` содержит буквенную оценку за каждый курс, а `credits[i]` — кредитный вес курса `i`.

Буквенные оценки переводятся в баллы так: `A` = 4.0, `A-` = 3.7, `B+` = 3.3, `B` = 3.0, `B-` = 2.7, `C+` = 2.3, `C` = 2.0, `C-` = 1.7, `D+` = 1.3, `D` = 1.0, `D-` = 0.7, `F` = 0.0. Оценки `"P"` (зачёт) и `"NP"` (незачёт) считаются «зачёт/незачёт» и полностью исключаются из среднего балла, не добавляя ни баллов, ни кредитов.

Средний балл — это взвешенное по кредитам среднее баллов по всем оцениваемым курсам: сумма `points * credits`, делённая на сумму учитываемых кредитов.

Верните средний балл, округлённый до двух знаков после запятой, или $0.0$, если оцениваемых кредитов нет.
"""

limits = """
- $0 \\leq \\text{len}(\\text{grades}) \\leq 10^3$
- $\\text{len}(\\text{grades}) = \\text{len}(\\text{credits})$
- $1 \\leq \\text{credits}[i] \\leq 10$
- $\\text{grades}[i]$ is one of the listed letter grades, `"P"`, or `"NP"`
"""

solution = """
def solution(grades: list, credits: list) -> float:
    pts = {
        "A": 4.0, "A-": 3.7, "B+": 3.3, "B": 3.0, "B-": 2.7,
        "C+": 2.3, "C": 2.0, "C-": 1.7, "D+": 1.3, "D": 1.0,
        "D-": 0.7, "F": 0.0,
    }
    total = 0.0
    counted = 0
    for g, c in zip(grades, credits):
        if g in ("P", "NP"):
            continue
        total += pts[g] * c
        counted += c
    if counted == 0:
        return 0.0
    return round(total / counted, 2)
"""

examples = """
solution([], []) == 0.0
solution(["A"], [3]) == 4.0
solution(["A", "B"], [3, 3]) == 3.5
solution(["P", "A"], [3, 3]) == 4.0
solution(["F", "F"], [3, 3]) == 0.0
"""

