base_score        = 150
level             = "medium"
name              = "log_ip_sanitizer"
tags              = ["regex", "strings"]
time_to_solve_sec = 300

description_en = """
You're given a log line as a string `s`.
Replace every **valid** IPv4 address with the exact text `[REDACTED]`.

A valid IPv4 is four decimal octets separated by dots: `a.b.c.d`, where each `a..d` is in `0..255`.
Leading zeros are allowed (e.g. `001.002.003.004`).
An IPv4 must not be part of a longer digit sequence (it's bounded by non-digits or string ends).

Process valid addresses from left to right without overlapping replacements.
Return the transformed string.
Keep all other characters unchanged.
If there are no valid IPv4 addresses, return the original string.
"""

description_ru = """
Дана строка лога `s`.
Замените все **корректные** IPv4-адреса на текст `[REDACTED]`.

Корректный IPv4 — это четыре десятичных октета, разделённых точками: `a.b.c.d`, где каждое `a..d` в диапазоне `0..255`.
Ведущие нули разрешены (например, `001.002.003.004`).
IPv4 не должен быть частью более длинной цифровой последовательности (он ограничен нецифровыми символами или концами строки).

Обрабатывайте корректные адреса слева направо без пересекающихся замен.
Верните преобразованную строку.
Все остальные символы должны остаться без изменений.
Если корректных IPv4 нет — верните исходную строку.
"""

description_es = """
Se le proporciona una línea de registro como una cadena `s`.
Reemplace cada dirección IPv4 **válida** con el texto exacto `[REDACTED]`.

Un IPv4 válido son cuatro octetos decimales separados por puntos: `a.b.c.d`, donde cada `a..d` está en `0..255`.
Se permiten ceros a la izquierda (por ejemplo, `001.002.003.004`).
Un IPv4 no debe ser parte de una secuencia de dígitos más larga (está delimitada por extremos de cadena o que no son dígitos).

Procese direcciones válidas de izquierda a derecha sin superponer reemplazos.
Devuelve la cadena transformada.
Mantenga todos los demás personajes sin cambios.
Si no hay direcciones IPv4 válidas, devuelva la cadena original.
"""

description_zh = """
您将获得一个字符串 `s` 形式的日志行。
将每个**有效** IPv4 地址替换为确切的文本 `[REDACTED]`。

有效的 IPv4 是由点分隔的四个十进制八位字节：`a.b.c.d`，其中每个 `a..d` 位于 `0..255` 中。
允许使用前导零（例如 `001.002.003.004`）。
IPv4 不能是较长数字序列的一部分（它由非数字或字符串结尾界定）。

从左到右处理有效地址，不重叠替换。
返回转换后的字符串。
保持所有其他字符不变。
如果没有有效的 IPv4 地址，则返回原始字符串。
"""

limits = """
- $0 \\leq \\text{len}(s) \\leq 100$
"""

examples = """
solution("256.0.0.1") == "256.0.0.1"
solution("no ip here") == "no ip here"
solution("255.255.255.255") == "[REDACTED]"
solution("ip=1.2.3.4, ok") == "ip=[REDACTED], ok"
solution("1.1.1.1 2.2.2.2") == "[REDACTED] [REDACTED]"
"""

solution = """
import re

def solution(s: str) -> str:
    octet = r'0*(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[0-9]{1,2})'
    ipv4 = rf'(?<!\\d){octet}(?:\\.{octet}){{3}}(?!\\d)'
    return re.sub(ipv4, '[REDACTED]', s)
"""

[[input_signature]]
argument_name = "s"
[input_signature.type]
name = "string"

[output_signature.type]
name = "string"

