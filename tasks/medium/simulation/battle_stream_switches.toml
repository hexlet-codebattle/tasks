description_en = """
In the new University Battle broadcast, you can watch a specific participant. The battle broadcast is watched by $n$ viewers, with a total of $m$ participants. Each viewer has a favorite and a least favorite participant. If the broadcast shows a participant disliked by a viewer, that viewer becomes upset and switches the broadcast to their favorite participant. If the current participant is disliked by multiple viewers, the viewer with the lowest number switches the broadcast. This process is repeated as long as there are disliked viewers.

First, participant number $p$ is shown in the broadcast. Determine how many times viewers will switch the broadcast. If the broadcast switching process is infinite, return $-1$.

The viewers array specifies a pair (favorite participant, least favorite participant) for each viewer.
"""

description_ru = """
В новой трансляции Баттла вузов можно наблюдать за конкретным участником. За трансляцией баттла наблюдает $n$ зрителей, всего в баттле $m$ участников. У каждого зрителя есть любимый и нелюбимый участник. Если в трансляции показывают участника, которого не любит какой-либо зритель, то этот зритель возмущается и переключает трансляцию на своего любимого участника. Если текущий участник является нелюбимым у нескольких зрителей, то трансляцию переключает зритель с наименьшим номером. Этот процесс повторяется, пока есть возмущенные зрители.

Сначала в трансляции демонстрируется участник с номером $p$. Определите, сколько раз зрители будут переключать трансляцию. Если процесс переключения трансляции будет бесконечным, верните $-1$.

В массиве viewers для каждого зрителя задана пара (любимый участник, нелюбимый участник).
"""

description_es = """
En la nueva transmisión de University Battle, puedes ver a un participante específico. La transmisión de la batalla es vista por espectadores de $n$, con un total de participantes de $m$. Cada espectador tiene un participante favorito y uno menos favorito. Si la transmisión muestra a un participante que no le agrada a un espectador, ese espectador se molesta y cambia la transmisión a su participante favorito. Si varios espectadores no agradan al participante actual, el espectador con el número más bajo cambia la transmisión. Este proceso se repite siempre que haya espectadores que no les gusten.

Primero, en la transmisión se muestra el número de participante $p$. Determina cuántas veces los espectadores cambiarán la transmisión. Si el proceso de conmutación de transmisión es infinito, devuelva $-1$.

La matriz de espectadores especifica un par (participante favorito, participante menos favorito) para cada espectador.
"""

description_zh = """
在新的大学之战直播中，您可以观看特定的参赛者。观看战斗转播的观众人数为$n$，参与人数总计为$m$。每个观众都有一个最喜欢的和最不喜欢的参与者。如果广播显示观众不喜欢的参与者，则该观众会感到不安并将广播切换到他们最喜欢的参与者。如果当前参与者被多个观众不喜欢，则数量最少的观众会切换广播。只要有不喜欢的观众，就会重复这个过程。

首先，广播中显示参与者编号$p$。确定观众切换广播的次数。如果广播切换过程无限，则返回$-1$。

观众数组为每个观众指定一对（最喜欢的参与者，最不喜欢的参与者）。
"""

solution = """
def solution(n, m, p, viewers):
    \"\"\"Return the number of switches of the broadcast, or -1 if it is infinite.

    Parameters:
        n (int): Number of viewers.
        m (int): Number of participants (not used directly in the algorithm).
        p (int): Initial participant shown.
        viewers (list of [int, int]): List of [favorite, disliked] for each viewer,
                                      ordered by viewer index (0‑based).

    Returns:
        int: Number of switches, or -1 if the process never terminates.
    \"\"\"
    # Build mapping from a disliked participant to the favorite of the
    # earliest viewer that dislikes it.
    next_map = {}
    for fav, dis in viewers:
        if dis not in next_map:
            next_map[dis] = fav

    cur = p
    switches = 0
    visited = set()
    while True:
        if cur in visited:
            return -1
        visited.add(cur)
        if cur not in next_map:
            return switches
        cur = next_map[cur]
        switches += 1
"""

examples = """
solution(3, 4, 2, [[1, 2], [2, 3], [3, 2]]) == 1
solution(3, 3, 1, [[1, 2], [2, 3], [3, 1]]) == -1
solution(4, 5, 2, [[1, 3], [2, 3], [3, 2], [5, 1]]) == 3
"""

