description_en = '''
We have a screen of size $h \times w$ (rows are numbered from 1 at the top, columns from 1 on the left) initially filled with '.' characters. A list of frames is drawn on the screen. The $i$‑th frame is the border of the rectangle whose opposite corners are $(\mathrm{row}_{i,1}, \mathrm{col}_{i,1})$ and $(\mathrm{row}_{i,2}, \mathrm{col}_{i,2})$ ($\mathrm{row}_{i,1} < \mathrm{row}_{i,2}$, $\mathrm{col}_{i,1} < \mathrm{col}_{i,2}$). The frame consists of the $i$‑th letter of the English alphabet ('a' for $i=1$, 'b' for $i=2$, …). Frames are drawn in the given order, overwriting previous characters. Return the final picture as an array of $h$ strings, each of length $w$.
'''

description_ru = '''
На экране размером $h \times w$ (нумерация строк и столбцов начинается с 1) изначально все клетки заполнены символом «.». По очереди рисуются рамки – границы прямоугольников с противоположными углами в клетках с координатами$(\mathrm{row}_{i,1}, \mathrm{col}_{i,1})$ и $(\mathrm{row}_{i,2}, \mathrm{col}_{i,2})$, где $\mathrm{row}_{i,1} < \mathrm{row}_{i,2}$ и $\mathrm{col}_{i,1} < \mathrm{col}_{i,2}$. $i$‑я рамка заполняется $i$‑й буквой английского алфавита (a, b, …). При рисовании рамка перезаписывает уже нарисованные символы. Вернуть получившееся изображение в виде массива из $h$ строк.
'''

description_es = """
Tenemos una pantalla de tamaño $h \\times w$ (las filas están numeradas desde 1 en la parte superior, las columnas desde 1 a la izquierda) inicialmente llena con '.' personajes. Se dibuja una lista de fotogramas en la pantalla. El marco $i$-ésimo es el borde del rectángulo cuyas esquinas opuestas son $(\\mathrm{row}_{i,1}, \\mathrm{col}_{i,1})$ y $(\\mathrm{row}_{i,2}, \\mathrm{col}_{i,2})$ ($\\mathrm{row}_{i,1} < \\mathrm{row}_{i,2}$, $\\mathrm{col}_{i,1} < \\mathrm{col}_{i,2}$). El marco consta de la $i$, enésima letra del alfabeto inglés ('a' para $i=1$, 'b' para $i=2$,...). Los fotogramas se dibujan en el orden indicado, sobrescribiendo los caracteres anteriores. Devuelve la imagen final como una matriz de cadenas $h$, cada una de longitud $w$.
"""

description_zh = """
我们有一个大小为 $h \\times w$ 的屏幕（行从顶部的 1 开始编号，列从左侧的 1 开始编号），最初用“.”填充。人物。屏幕上绘制了帧列表。第 $i$ 帧是对角为 $(\\mathrm{row}_{i,1}, \\mathrm{col}_{i,1})$ 和 $(\\mathrm{row}_{i,2}, \\mathrm{col}_{i,2})$（$\\mathrm{row}_{i,1} < \\mathrm{row}_{i,2}$、$\\mathrm{col}_{i,1} < \\mathrm{col}_{i,2}$）的矩形的边界。该帧由英文字母表中的第 $i$ 字母组成（“a”代表 $i=1$，“b”代表 $i=2$，...）。帧按照给定的顺序绘制，覆盖之前的字符。将最终图片作为 $h$ 字符串数组返回，每个字符串的长度为 $w$。
"""

solution = """
def solution(h, w, frames):
    # create empty screen filled with '.'
    grid = [['.' for _ in range(w)] for _ in range(h)]

    for i, (r1, c1, r2, c2) in enumerate(frames):
        ch = chr(ord('a') + i)          # i‑я буква алфавита
        r1i, c1i = r1 - 1, c1 - 1
        r2i, c2i = r2 - 1, c2 - 1

        # top and bottom edges
        for col in range(c1i, c2i + 1):
            grid[r1i][col] = ch
            grid[r2i][col] = ch

        # left and right edges (excluding corners already set)
        for row in range(r1i + 1, r2i):
            grid[row][c1i] = ch
            grid[row][c2i] = ch

    return [''.join(row) for row in grid]
"""

examples = """
solution(6, 7, [[3, 1, 6, 6]]) == [
    ".......",
    ".......",
    "aaaaaa.",
    "a....a.",
    "a....a.",
    "aaaaaa."
]
solution(5, 8, [[2, 1, 4, 5], [1, 1, 2, 2], [1, 2, 3, 3]]) == [
    "bcc.....",
    "bccaa...",
    "acc.a...",
    "aaaaa...",
    "........"
]
"""

