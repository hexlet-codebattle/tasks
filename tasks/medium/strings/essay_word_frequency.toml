base_score        = 150
level             = "medium"
name              = "essay_word_frequency"
tags              = ["strings", "hash_maps", "university"]
time_to_solve_sec = 300

description_en = """
A writing tutor at the university's writing center wants to know which word a student leans on the most in an essay `text`.

A word is a maximal run of letters, compared case-insensitively; everything else (digits, punctuation, whitespace, accented characters) acts as a separator.

Return the most frequent word in lowercase. If several words tie for the highest frequency, return the alphabetically smallest of them. If `text` contains no letters, return `""`.
"""

description_ru = """
Преподаватель из учебного центра письма хочет узнать, какое слово студент чаще всего использует в эссе `text`.

Словом считается максимальная последовательность букв, регистр не учитывается; всё остальное (цифры, знаки препинания, пробелы, символы с диакритикой) служит разделителем.

Верните самое частое слово в нижнем регистре. Если несколько слов встречаются одинаково часто, верните лексикографически наименьшее из них. Если в `text` нет букв, верните `""`.
"""

description_es = """
Un tutor de redacción del centro de redacción de la universidad quiere saber en qué palabra se apoya más un estudiante en un ensayo `text`.

Una palabra es una serie máxima de letras, comparadas sin distinguir entre mayúsculas y minúsculas; todo lo demás (dígitos, puntuación, espacios en blanco, caracteres acentuados) actúa como separador.

Devuelve la palabra más frecuente en minúsculas. Si varias palabras empatan en la frecuencia más alta, devuelve la más pequeña alfabéticamente. Si `text` no contiene letras, devuelva `\"\"`.
"""

description_zh = """
大学写作中心的一位写作导师想知道学生在论文 `text` 中最依赖哪个单词。

单词是字母的最大串，比较时不区分大小写；其他所有内容（数字、标点符号、空格、重音字符）都充当分隔符。

以小写形式返回最常见的单词。如果多个单词出现频率最高，则返回其中按字母顺序排列最小的单词。如果 `text` 不包含字母，则返回 `\"\"`。
"""

limits = """
- $0 \\leq \\text{len}(\\text{text}) \\leq 10^4$
"""

solution = """
def solution(text: str) -> str:
    s = "".join(c.lower() if c.isalpha() else " " for c in text)
    words = s.split()
    if not words:
        return ""
    counts = {}
    for w in words:
        counts[w] = counts.get(w, 0) + 1
    m = max(counts.values())
    return min(w for w in counts if counts[w] == m)
"""

examples = """
solution("") == ""
solution("123 456") == ""
solution("a b a b c") == "a"
solution("the the cat") == "the"
solution("Hello hello HELLO") == "hello"
"""

[[input_signature]]
argument_name = "text"
[input_signature.type]
name = "string"

[output_signature.type]
name = "string"

[[asserts]]
arguments = [""]
comment   = "Empty text"
expected  = ""

[[asserts]]
arguments = ["   "]
comment   = "Only spaces"
expected  = ""

[[asserts]]
arguments = ["123 456 !!!"]
comment   = "No letters"
expected  = ""

[[asserts]]
arguments = ["cat"]
comment   = "Single word"
expected  = "cat"

[[asserts]]
arguments = ["the the cat"]
comment   = "The wins"
expected  = "the"

[[asserts]]
arguments = ["Hello hello HELLO"]
comment   = "Case insensitive"
expected  = "hello"

[[asserts]]
arguments = ["a b a b c"]
