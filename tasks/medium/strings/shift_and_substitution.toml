base_score        = 150
level             = "medium"
name              = "shift_and_substitution"
tags              = ["strings", "mapping", "rotation"]
time_to_solve_sec = 400

description_en = """
A string $S$ is cyclically shifted left by $K$ positions, then a bijective substitution is applied over lowercase letters:
equal letters map to equal letters, different letters map to different letters.

Given $S$ and $T$, return the minimal shift $K \\ge 0$ for which $T$ can be obtained, or $-1$ if impossible.
"""

description_ru = """
Строку $S$ циклически сдвигают влево на $K$ позиций, затем применяют биективную замену по строчным буквам:
одинаковые буквы переходят в одинаковые, разные — в разные.

По данным $S$ и $T$ верните минимальный сдвиг $K \\ge 0$, при котором можно получить $T$, или $-1$, если это невозможно.
"""

description_es = """
Una cadena $S$ se desplaza cíclicamente hacia la izquierda en posiciones $K$, luego se aplica una sustitución biyectiva sobre letras minúsculas:
letras iguales se asignan a letras iguales, letras diferentes se asignan a letras diferentes.

Dados $S$ y $T$, devuelva el desplazamiento mínimo $K \\ge 0$ para el cual se puede obtener $T$, o $-1$ si es imposible.
"""

description_zh = """
将字符串 $S$ 循环左移 $K$ 位置，然后对小写字母应用双射替换：
相同的字母映射到相同的字母，不同的字母映射到不同的字母。

给定 $S$ 和 $T$，返回可以获得 $T$ 的最小移位 $K \\ge 0$，如果不可能，则返回 $-1$。
"""

limits = """
- $1 \\le |S| = |T| \\le 20$
- $S, T \\in \\{a,\\ldots,z\\}^{|S|}$
"""

solution = """
def solution(s: str, t: str) -> int:
    if len(s) != len(t):
        return -1

    def ok(a, b):
        mp, used = {}, set()
        for x, y in zip(a, b):
            if x in mp:
                if mp[x] != y:
                    return False
            else:
                if y in used:
                    return False
                mp[x] = y
                used.add(y)
        return True

    n = len(s)
    u = t
    for k in range(n):
        if ok(u, s):
            return k
        u = u[1:] + u[0]
    return -1
"""

examples = """
solution("abac", "mknk") == 1
solution("abac", "kmkn") == 0
solution("abac", "kkkn") == -1
"""

