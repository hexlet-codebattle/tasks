base_score        = 160
level             = "medium"
name              = "string_swaps"
tags              = ["strings", "greedy"]
time_to_solve_sec = 300

description_en = """
Given a pattern string and a set of strings of equal length. In one operation you may
choose any two strings from the set and swap the characters at the same position in
both strings. Determine the minimum number of such swaps needed so that at least one
string from the set becomes equal to the pattern string, or return -1 if it is
impossible.
"""

description_ru = """
Задана строка‑образец и набор строк одинаковой длины. Разрешается выбрать любые две
строки из набора и поменять местами их символы, стоящие на одной и той же позиции.
Определите минимальное количество таких замен, чтобы хотя бы одна из строк набора
совпала со строкой‑образцом, или верните ‑1, если получить образец таким способом
невозможно.
"""

solution = """
def solution(pattern: str, strings: list[str]) -> int:
    \"\"\"Return the minimal number of swaps needed to obtain *pattern*,
    or -1 if it cannot be obtained.

    Parameters
    ----------
    pattern: str
        The target string.
    strings: list[str]
        List of strings, all of the same length as ``pattern``.
    \"\"\"
    # No strings – we cannot create the pattern.
    if not strings:
        return -1

    length = len(pattern)

    # 1) Every character of the pattern must be present in its column.
    for i in range(length):
        column_chars = {s[i] for s in strings}
        if pattern[i] not in column_chars:
            return -1

    # 2) The minimal number of swaps equals the minimal Hamming distance
    #    between the pattern and any row of the matrix.
    min_swaps = min(
        sum(1 for i, ch in enumerate(row) if ch != pattern[i])
        for row in strings
    )
    return min_swaps
"""

examples = """
solution("acb", ["abc", "cab", "bca"]) == 2
solution("acd", ["abc", "cab", "bca"]) == -1
solution("zx", ["zx", "zx"]) == 0
