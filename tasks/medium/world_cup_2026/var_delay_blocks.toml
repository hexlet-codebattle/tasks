base_score        = 140
level             = "medium"
name              = "var_delay_blocks"
tags              = ["world_cup_2026", "sweep_line"]
time_to_solve_sec = 400

description_en = """
VAR reviews are half-open intervals `[start, end)`, measured in seconds from kickoff. Return `[covered_time, peak_reviews]`: the total time covered by at least one review and the maximum number of simultaneous reviews. Empty intervals are ignored.
"""

description_ru = """
VAR-проверки заданы полуинтервалами `[start, end)`, где время измеряется в секундах от начала матча. Верните `[covered_time, peak_reviews]`: суммарное время работы хотя бы одной проверки и максимальное число одновременных проверок. Пустые интервалы игнорируются.
"""

limits = """
- $0 \\leq \\operatorname{len}(intervals) \\leq 1000$
- $\\operatorname{len}(intervals_i) = 2$
- $0 \\leq start_i \\leq end_i \\leq 10000$
"""

solution = """
def solution(intervals: list[list[int]]) -> list[int]:
    events = {}
    for start, end in intervals:
        if start < end:
            events[start] = events.get(start, 0) + 1
            events[end] = events.get(end, 0) - 1
    active = total = peak = 0
    previous = min(events) if events else 0
    for moment in sorted(events):
        total += moment - previous if active else 0
        active += events[moment]
        peak = max(peak, active)
        previous = moment
    return [total, peak]
"""

examples = """
solution([]) == [0, 0]
solution([[0, 1]]) == [1, 1]
solution([[0, 2], [1, 3]]) == [3, 2]
"""

