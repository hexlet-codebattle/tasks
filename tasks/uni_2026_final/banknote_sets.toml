base_score        = 140
level             = "easy"
name              = "banknote_sets"
tags              = ["math", "combinatorics"]
time_to_solve_sec = 300

description_en = """
Vasya has an unlimited number of banknotes of denominations $50$, $100$, and $200$ rubles. Determine the number of different sets of banknotes that sum up to $n$ rubles, where $0 \\le n \\le 1\\,000\\,000$. Sets are considered different if they differ in the number of any type of banknote.
"""

description_ru = """
У Васи есть неограниченное количество купюр номиналом $50$, $100$ и $200$ рублей. Определите количество различных наборов купюр, с помощью которых можно набрать сумму $n$ рублей, где $0 \\le n \\le 1\\,000\\,000$. Наборы считаются различными, если в них различается количество какого-либо типа купюр.
"""

solution = """
def solution(n):
    # If n is not a multiple of 50, there is no way to compose it
    if n % 50 != 0:
        return 0
    m = n // 50          # reduce denominations to 1, 2, 4
    p = m & 1            # parity of m (0 for even, 1 for odd)
    c_max = m // 4       # maximum number of 200‑ruble notes (value 4 in reduced units)
    # total = (c_max + 1) * ((m - p) // 2 + 1 - c_max)
    total = (c_max + 1) * ((m - p) // 2 + 1 - c_max)
    return total
"""

examples = """
solution(50) == 1
solution(36) == 0
solution(200) == 4
"""

examples_list = ["solution(50) == 1", "solution(36) == 0", "solution(200) == 4"]

