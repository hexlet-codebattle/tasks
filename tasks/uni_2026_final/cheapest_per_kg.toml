name              = "cheapest_per_kg"
tags              = ["uni_2026_final", "math", "greedy"]
time_to_solve_sec = 150

description_en = """
Products are sold in packages with varying prices and weights. Determine the product number with the lowest price per kilogram, starting with $0. If there are multiple such products, select the one with the lowest number. Products are described by a pair (price, weight)."""

description_ru = """
Товары продаются в упаковках с различной ценой и весом. Определите номер товара при нумерации с $0$ с самой низкой ценой за килограмм. Если таких товаров несколько, выберите товар с наименьшим номером. Товар описывается парой (цена, вес).
"""

solution = """
def solution(items):
    # items is a list of [price, weight] pairs
    best = 0
    for i in range(1, len(items)):
        p_i, w_i = items[i]
        p_best, w_best = items[best]
        # compare p_i / w_i with p_best / w_best using cross‑multiplication
        if p_i * w_best < p_best * w_i:
            best = i
    return best
"""

examples = """
solution([[5, 100], [4, 100], [3, 100], [7, 100]]) == 2
solution([[100, 5], [99, 8], [65, 14], [78, 10]]) == 2
"""

