base_score        = 160
level             = "medium"
name              = "frame_tiling"
tags              = ["tiling", "grid", "math", "combinatorics"]
time_to_solve_sec = 300

description_en = """
A frame of size $x \\times y$ is a rectangle of size $x \\times y$ from whose centre a rectangle of size $(x - 2) \\times (y - 2)$ has been cut out.
Example of frame $4 \\times 3$:
```text
####
#..#
####
```
The frame has a thickness of one cell. For each of $n$ tile lengths $a_i$ determine whether the frame can be tiled
with tiles of size $1 \\times a_i$. Numbers $x$ and $y$ are up to $10^6$, and $n$ is up to $300$.
"""

description_ru = """
Рамка размером $x \\times y$ - это прямоугольник $x \\times y$, из центра которого вырезан прямоугольник $(x - 2) \\times (y - 2)$.
Пример рамки $4 \\times 3$:
```text
####
#..#
####
```
Рамка имеет толщину в одну клетку. Для каждого из $n$ вариантов длины плитки $a_i$ определите, можно ли замостить
рамку плитками $1 \\times a_i$. Числа $x$ и $y$ до $10^6$, $n$ до $300$.
"""

solution = """
def solution(x, y, a):
    # Return a list of booleans: for each tile length a_i indicate if the frame can be tiled.
    res = []
    for L in a:
        # Length 1 always works (each cell can be covered separately).
        if L == 1:
            res.append(True)
            continue
        ok = False
        # There are 2^4 possible assignments of the four corners.
        # Bit 0 – top‑left corner (0 → horizontal (top), 1 → vertical (left))
        # Bit 1 – top‑right corner (0 → horizontal (top), 1 → vertical (right))
        # Bit 2 – bottom‑left corner (0 → horizontal (bottom), 1 → vertical (left))
        # Bit 3 – bottom‑right corner (0 → horizontal (bottom), 1 → vertical (right))
        for mask in range(16):
            top    = x - ((mask >> 0) & 1) - ((mask >> 1) & 1)
            bottom = x - ((mask >> 2) & 1) - ((mask >> 3) & 1)
            left   = y - 2 + ((mask >> 0) & 1) + ((mask >> 2) & 1)
            right  = y - 2 + ((mask >> 1) & 1) + ((mask >> 3) & 1)
            if top % L == 0 and bottom % L == 0 and left % L == 0 and right % L == 0:
                ok = True
                break
        res.append(ok)
    return res
"""

examples = """
solution(5, 6, [3, 4]) == [True, False]
solution(5, 4, [1, 2, 3, 4]) == [True, True, False, False]
"""

examples_list = [
  "solution(5, 6, [3, 4]) == [True, False]",
  "solution(5, 4, [1, 2, 3, 4]) == [True, True, False, False]",
  "solution(3, 3, [1, 2, 3]) == [True, True, False]",
]

