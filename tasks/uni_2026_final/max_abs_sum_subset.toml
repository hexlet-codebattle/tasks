base_score        = 100
level             = "easy"
name              = "max_abs_sum_subset"
tags              = ["math", "greedy"]
time_to_solve_sec = 210

description_en = """
Given $n$ cards, each card has an integer written on it. The player may choose any subset of the cards, including possibly none. The gain is the absolute value of the sum of the numbers on the selected cards. Determine the maximum possible gain.
"""

description_ru = """
На каждой из $n$ карточек написано число. Игрок может выбрать любое подмножество карточек, в том числе пустое. Выигрыш равен модулю суммы чисел на выбранных карточках. Определите максимальный возможный выигрыш.
"""

solution = """
def solution(n, a):
    pos_sum = sum(x for x in a if x > 0)
    neg_sum = sum(-x for x in a if x < 0)
    return max(pos_sum, neg_sum)
"""

examples = """
solution(3, [2, -3, 2]) == 4
solution(2, [-10, 9]) == 10
"""

examples_list = [
  "solution(3, [2, -3, 2]) == 4",
  "solution(2, [-10, 9]) == 10",
  "solution(4, [1, 2, 3, 4]) == 10",
]

