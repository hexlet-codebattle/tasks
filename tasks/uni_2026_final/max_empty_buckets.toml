description_en = """
For each bucket, the amount of water in it, $w_i$, and its capacity, $c_i$, are known.
You are allowed to pour any amount of water from any bucket to any other. Pouring water outside the buckets is prohibited.
Find the maximum number of buckets that can be empty after any pouring.
Buckets in the buckets array are represented as (amount of water in the bucket, its capacity).
"""

description_ru = """
Для каждого из ведер известно количество воды в нем $w_i$ и его вместимость $c_i$.
Разрешается переливать любое количество воды из любого ведра в любое другое. Выливать воду за пределы ведер нельзя.
Найдите максимальное количество ведер, которые можно сделать пустыми после любых переливаний.
Ведра в массиве buckets представлены как (количество воды в ведре, его вместимость).
"""

solution = """
def solution(buckets):
    total_water = sum(w for w, _ in buckets)
    if total_water == 0:
        return len(buckets)
    capacities = sorted((c for _, c in buckets), reverse=True)
    used = 0
    accumulated = 0
    for cap in capacities:
        accumulated += cap
        used += 1
        if accumulated >= total_water:
            break
    return len(buckets) - used
"""

examples = """
solution([[2,6],[1,6],[0,6],[6,6],[5,6]]) == 2
solution([[4,5],[2,7],[5,5],[0,10],[7,9]]) == 3
"""

