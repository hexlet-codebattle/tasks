level             = "easy"
name              = "balance_weights"
tags              = ["brute_force"]
time_to_solve_sec = 180

description_en = """
You are given the weights of four weights. Determine whether it is possible to place all four
weights on the two pans of a balance scale so that the scale becomes balanced.
"""

description_ru = """
Даны веса четырёх гирек. Определите, можно ли разместить их на двух чашах весов так,
чтобы весы уравновесились.
"""

solution = """
def solution(weights):
    \"\"\"Return True if the four weights can be split into two groups with equal sum.

    Args:
        weights (list[int]): list of four integer weights.

    Returns:
        bool: True – a balanced placement exists, False – otherwise.
    \"\"\"
    total = sum(weights)
    # a balance is possible only when the total weight is even
    if total % 2 != 0:
        return False
    target = total // 2

    # there are only 2⁴ = 16 subsets – brute‑force them
    for mask in range(1 << 4):
        cur = 0
        for i in range(4):
            if mask & (1 << i):
                cur += weights[i]
        if cur == target:
            return True
    return False
"""

examples = """
solution([3, 4, 2, 1]) == True
solution([2, 2, 6, 2]) == True
solution([1, 3, 5, 2]) == False
"""

