description_ru = """
В химическом уравнении слева и справа записаны наборы молекул, разделённые символом «+».
Молекула состоит из атомов (каждый атом обозначается заглавной английской буквой). После атома может стоять цифра 1‑9 — количество атомов.
Перед молекулой может стоять цифра 1‑9 — количество её копий. Нужно определить, сбалансировано ли уравнение, то есть совпадает ли количество вхождений каждого атома в левой и правой частях.
"""

description_en = """
In a chemical equation there are two parts: the left side (reactants) and the right side (products).
Molecules are separated by the '+' sign. A molecule consists of atoms denoted by uppercase English letters.
A digit 1‑9 after an atom indicates how many such atoms are present.
A digit 1‑9 before a molecule indicates how many copies of this molecule appear.
Determine whether the equation is balanced, i.e. the counts of each atom are equal on both sides.
"""

solution = """
from collections import Counter
from typing import Dict

def _parse_side(side: str) -> Counter:
    \"\"\"Parse a side of the equation and return a Counter of atom → total count.\"\"\"
    total = Counter()
    for molecule in side.split('+'):
        if not molecule:
            continue
        # coefficient (optional)
        coeff = 1
        idx = 0
        if molecule[0].isdigit():
            coeff = int(molecule[0])
            idx = 1
        # parse atoms inside the molecule
        while idx < len(molecule):
            atom = molecule[idx]            # must be an uppercase letter
            idx += 1
            count = 1
            if idx < len(molecule) and molecule[idx].isdigit():
                count = int(molecule[idx])
                idx += 1
            total[atom] += coeff * count
    return total

def solution(left: str, right: str) -> bool:
    \"\"\"Return True iff the chemical equation `left = right` is balanced.\"\"\"
    left_counts = _parse_side(left)
    right_counts = _parse_side(right)
    return left_counts == right_counts
"""

examples = """
solution("A+B", "AB") == True
solution("AB+CD", "AC+DB") == True
solution("2AB+A", "3AB") == False
solution("2H2O+2CO2", "2H2CO3") == True
"""

