level             = "easy"
name              = "diagonal_letters"
tags              = ["grid", "string", "math"]
time_to_solve_sec = 180

description_en = '''
Fill an $n \times n$ square with letters, where the cells on the main diagonal and the secondary (anti‑) diagonal contain the letter “a”, and every other cell is filled with the letter whose position in the alphabet (0‑based) equals the minimal distance (in cells) to the nearest diagonal cell. For a cell $(i, j)$ (0‑based) this distance equals $\min(\lvert i - j \rvert,\ \lvert i + j - (n - 1) \rvert)$. Return an array of $n$ strings, each of length $n$.
'''

description_ru = '''
Заполните квадрат $n \times n$ буквами, где клетки главной и побочной диагонали содержат букву 'a', а каждая другая клетка заполнена буквой, номер которой в алфавите (нумерация букв с нуля) равен минимальному расстоянию по клеткам до ближайшей клетки диагонали. Для клетки $(i, j)$ (нумерация с 0) это расстояние равно $\min(\lvert i - j \rvert,\ \lvert i + j - (n - 1) \rvert)$. Верните массив из $n$ строк длиной $n$.
'''

solution = """
def solution(n: int) -> list[str]:
    \"\"\"Return an n×n grid of letters as described in the statement.

    For each cell (i, j) (0‑based) the distance to the nearest diagonal is
    min(|i - j|, |i + j - (n - 1)|). The letter is 'a' + distance.
    \"\"\"
    rows = []
    for i in range(n):
        row_chars = []
        for j in range(n):
            d = min(abs(i - j), abs(i + j - (n - 1)))
            row_chars.append(chr(ord('a') + d))
        rows.append(''.join(row_chars))
    return rows
"""

examples = """
solution(5) == [
    "abcba",
    "babab",
    "cbabc",
    "babab",
    "abcba"
]
solution(4) == [
    "abba",
    "baab",
    "baab",
    "abba"
]
"""

