level             = "hard"
name              = "robot_spiral_grid"
tags              = ["simulation", "grid", "set"]
time_to_solve_sec = 300

description_en = '''
The robot starts in the cell $(0, 0)$ and is initially facing to the right. It follows the algorithm below:

- Repeat the following actions twice: move forward $d$ cells, than turn left,
- Multiply $d$ by $2$ and go back to previous step.

The robot makes a total of $n$ moves. Return a minimal‑size array of strings in which a "*" marks a cell visited by the robot and a "." marks an unvisited cell.
'''

description_ru = '''
Робот находится в клетке $(0, 0)$ и направлен вправо. Он выполняет следующий алгоритм:

- два раза повторяет действия: пройти на $d$ клеток вперёд, повернуть налево,
- умножить $d$ на $2$ и перейти к предыдущему пункту.

Всего робот совершил $n$ пермещений. Верните массив строк минимального размера, в которых "*" помечены посещенные роботом клетки, а "." — непосещенные.
'''

solution = """
def solution(n, d, k):
    # starting position and direction (0: right, 1: up, 2: left, 3: down)
    x = y = 0
    visited = {(x, y)}
    steps = 0
    dir_idx = 0
    dirs = [(1, 0), (0, 1), (-1, 0), (0, -1)]
    cur_d = d

    while steps < n:
        for _ in range(2):                     # two segments of length cur_d
            for _ in range(cur_d):
                if steps >= n:
                    break
                dx, dy = dirs[dir_idx]
                x += dx
                y += dy
                visited.add((x, y))
                steps += 1
            dir_idx = (dir_idx + 1) % 4        # turn left
            if steps >= n:
                break
        cur_d *= k

    # bounding rectangle of visited cells
    min_x = min(px for px, _ in visited)
    max_x = max(px for px, _ in visited)
    min_y = min(py for _, py in visited)
    max_y = max(py for _, py in visited)

    # build grid from top (max_y) to bottom (min_y)
    result = []
    for yy in range(max_y, min_y - 1, -1):
        row = ''.join('*' if (xx, yy) in visited else '.' for xx in range(min_x, max_x + 1))
        result.append(row)
    return result
"""

examples = """
solution(13, 2, 2) == [
    "*****",
    "*...*",
    "*.***",
    "*....",
    "**..."
]
solution(1, 1, 2) == ["**"]
"""

