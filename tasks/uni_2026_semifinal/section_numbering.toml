level             = "easy"
name              = "section_numbering"
tags              = ["parsing", "strings", "formatting"]
time_to_solve_sec = 240

description_en = '''
Given a list of commands describing sections of a document, generate a list of strings with hierarchical numbering.
The commands can be:

- `section <title>` – a new top‑level section (numbered $1, 2, \ldots$).
- `subsection <title>` – a subsection inside the most recent section (numbered $1, 2, \ldots$ within that section).
- `subsubsection <title>` – a sub‑subsection inside the most recent subsection (numbered $1, 2, \ldots$ within that subsection).

After each command a single word – the title of the item – follows. Produce an array where each element consists of the computed number
(e.g. $1$, $1.2$, $1.2.1$) followed by a space and the title, exactly as shown in the examples.
'''

description_ru = '''
Задаются команды, описывающие структуру разделов. Команды могут быть:

- `section <название>` — новый раздел верхнего уровня (нумерация $1, 2, \ldots$).
- `subsection <название>` — подраздел внутри последнего объявленного раздела (нумерация $1, 2, \ldots$ внутри данного раздела).
- `subsubsection <название>` — под‑подраздел внутри последнего объявленного подраздела (нумерация $1, 2, \ldots$ внутри данного подраздела).

Cформируйте массив строк, где каждая строка состоит из номера пункта (например, $1$, $1.2$, $1.2.1$) и названия, разделённых одним пробелом, точно в том виде, как показано в примерах.
'''

solution = """
def solution(commands):
    \"\"\"Return a list with hierarchical numbers for each command.

    Parameters
    ----------
    commands : list[str]
        Each element is a string of the form ``"<type> <title>"`` where
        ``<type>`` is one of ``section``, ``subsection`` or ``subsubsection``,
        and ``<title>`` is a single word.

    Returns
    -------
    list[str]
        List of strings ``"<number> <title>"`` where ``<number>`` reflects the
        hierarchical position of the item.
    \"\"\"
    result = []
    sec = 0      # current section number
    sub = 0      # current subsection number inside the current section
    subsub = 0   # current subsubsection number inside the current subsection

    for cmd in commands:
        parts = cmd.split()
        if len(parts) != 2:
            # According to the statement all commands are well‑formed.
            continue
        typ, title = parts

        if typ == "section":
            sec += 1
            sub = 0
            subsub = 0
            number = f\"{sec}\"
        elif typ == "subsection":
            # subsection belongs to the most recent section
            sub += 1
            subsub = 0
            number = f\"{sec}.{sub}\"
        elif typ == "subsubsection":
            # subsubsection belongs to the most recent subsection
            subsub += 1
            number = f\"{sec}.{sub}.{subsub}\"
        else:
            # Unknown command – ignore (should not happen)
            continue

        result.append(f\"{number} {title}\")

    return result
"""

examples = """
solution(["section plants",
          "section animals",
          "section mushrooms"
         ]) == [
                "1 plants",
                "2 animals",
                "3 mushrooms"
               ]

solution(["section animals",
          "subsection cats",
          "subsection dogs",
          "subsubsection chewbakka"
         ]) == [
                "1 animals",
                "1.1 cats",
                "1.2 dogs",
                "1.2.1 chewbakka"
               ]
"""

